  else { const cold=s&&(s.states||[]).find(x=>x.cold&&x.reason);
    box.append(el("div",{class:"sc-ph"}, cold?cold.reason:(s&&s.resolved?"No capture yet":(s&&s.resolveNote)||"Unresolved route"))); }

}
function stageNote(n){

    el("div",{class:"sn-tags"}, ...noteTags(n), el("span",{class:"sn-status"}, DR_STATUS[n.status]||n.status)),
    el("div",{class:"sn-body"}, n.body));
}
function stageGalleryCard(id){

function stageFocus(id,ids){

      else fs.append(el("div",{class:"sc-ph"},"None"));

function renderStage(){
  const stage=document.getElementById("selstage"); if(!stage) return;
  if(S.sel.size===0 || S.selectMode){ stage.innerHTML=""; return; }
  const ids=[...S.sel];
  if(S.focusId && !S.sel.has(S.focusId)) S.focusId=null;
  const focus = ids.length===1 ? ids[0] : S.focusId;
  stage.innerHTML="";
  const head=el("div",{class:"stagehead"});
  if(focus && ids.length>1) head.append(el("button",{type:"button",class:BTN.outline,onclick:()=>{ S.focusId=null; renderStage(); },
    html:'<i class="ex-glyph ex-glyph--back" aria-hidden="true"></i>All screens'}));
  head.append(el("span",{class:"st-title"}, focus ? (byId.get(focus)?byId.get(focus).route:focus) : `Reviewing ${ids.length} screens`));
  head.append(el("span",{class:"st-hint"}, focus ? "Click the image to zoom. Esc closes." : "Click a screen to enlarge it. Esc closes."));
  stage.append(head);
  const body=el("div",{class:"stagebody",onclick:e=>{ if(e.target===body && focus && ids.length>1){ S.focusId=null; renderStage(); } }});
  if(focus) body.append(stageFocus(focus,ids));
  else { const grid=el("div",{class:"stagegrid"}); for(const id of ids) grid.append(stageGalleryCard(id)); body.append(grid); }
  stage.append(body);
}

/* Rebuilds the whole drawer; delegated handlers live on #drawer (bound once). */
function renderSel(){
  const d=document.getElementById("drawer");
  // Select mode keeps the drawer and stage down (the board stays live); the select bar
  // drives it. Empty and not pinned to the Review view: nothing to render.
  if(S.selectMode || (S.sel.size===0 && !S.drawerOpen && !drawerPinned())){ d.innerHTML=""; updateDrawer(); return; }
  const tab = S.sel.size===0 ? "activity" : S.drawerTab;
  try{
    d.innerHTML = drInspect() + (S.sel.size===0?"":drSwitch(tab)) +
      `<div class="drlower" role="tabpanel">${ tab==="review" && S.sel.size>0 ? drCompose() : drActivity() }</div>`;
  }catch(err){ d.innerHTML = `<pre class="ex-pre" style="margin:16px;color:var(--color-returned-ink);white-space:pre-wrap">${escHtml(err&&err.stack||err)}</pre>`; }
  const ta=d.querySelector(".drta");
  // Focus the note field on a mouse; on touch, focusing would raise the keyboard over the screen.
  if(ta){ ta.value=S.draft; if(tab==="review" && matchMedia("(pointer: fine)").matches) setTimeout(()=>{try{ta.focus();ta.selectionStart=ta.value.length;}catch{}},20); }
  updateDrawer();
}

const DR_CLOSE = `<button type="button" class="${BTN.icon} drx" data-drclose="1" title="Close (Esc)" aria-label="Close">${GLYPH_X}</button>`;
function drInspect(){
  if(S.sel.size===0)
    // Pinned on the Review view there is nothing to close: the bar is part of the screen.
    return `<div class="drins"><div class="drirow"><div class="dridcol">
      <div class="drroute plain">Reviews</div><div class="drsub" style="text-transform:none">Every note across the map. Nothing selected.</div>
      </div>${drawerPinned()?"":DR_CLOSE}</div></div>`;
  if(S.sel.size>1){
    const chips=[...S.sel].map(id=>`<span class="drchip">${escHtml(routeOf(id))}<button type="button" data-drdrop="${escHtml(id)}" aria-label="Remove ${escHtml(routeOf(id))}" title="Remove">${GLYPH_X}</button></span>`).join("");
    return `<div class="drins"><div class="drirow"><div class="dridcol">
      <div class="drroute plain">${S.sel.size} screens selected</div><div class="drchips">${chips}</div>
      <div class="drsub" style="margin-top:8px;text-transform:none">A note you write applies to all ${S.sel.size}.</div>
      </div>${DR_CLOSE}</div></div>`;
  }
  const id=[...S.sel][0], s=byId.get(id)||{route:id,states:[]};
  const src=shotSrc(s);
  const thumb = src
    ? `<div class="drthumb" data-drzoom="${escHtml(id)}" title="View full size"><img src="${src}" alt=""></div>`
    : `<div class="drthumb" data-drzoom="${escHtml(id)}"><span class="drph">No shot</span></div>`;
  const outs=dedupEdges(eFrom.get(id)||[],"to"), ins=dedupEdges(eTo.get(id)||[],"from");
  const nrev=activeReviews(id).length;
  const badges=signalBadges(s).map(([cls,label])=>`<span class="${cls}">${label}</span>`).join("")+
    (nrev?`<span class="${BADGE.review}">${nrev} in review</span>`:"");
  const vers=versionsOf(s);
  const tl = vers.length>1 ? `<div class="drtl">
    <div class="drk">${vers.length} versions<button type="button" class="ex-btn ex-btn--xs ex-btn--outline" data-drcompare="${escHtml(id)}">Compare before and after</button></div>
    <div class="drtlrow">${vers.map((v,i)=>`<button type="button" class="drtlv${i===0?" now":""}" data-drver="${escHtml(id)}:${i}" title="${v.now?"Current capture":"Captured "+escHtml(v.capturedAt||v.archivedAt||"")}">${v.now?"Now":ago(v.capturedAt||v.archivedAt)}</button>`).join("")}</div>
  </div>` : "";
  const fd=`<div class="drflowd${S.flowOpen?" open":""}">
    <div class="drk">Goes to (${outs.length})</div>
    ${outs.length?outs.map(e=>`<a data-drnav="${escHtml(e.to)}">${escHtml(routeOf(e.to))} <span class="drkind">${escHtml(e.kind)}</span></a>`).join(""):`<span class="drnone">A dead end: no links out.</span>`}
    <div class="drk">Reached from (${ins.length})</div>
    ${ins.length?ins.map(e=>`<a data-drnav="${escHtml(e.from)}">${escHtml(routeOf(e.from))}</a>`).join(""):`<span class="drnone">An orphan: nothing links here.</span>`}
  </div>`;
  return `<div class="drins">
    <div class="drirow">${thumb}
      <div class="dridcol">
        <div class="drroute">${escHtml(s.route)}</div>
        <div class="drsub">${escHtml(groupLabel(s.group))}${s.redirectTo?" · redirect hub":""}</div>
        <div class="drbadges">${badges}</div>
      </div>${DR_CLOSE}
    </div>
    <button type="button" class="drflow${S.flowOpen?" open":""}" data-drflow="1" aria-expanded="${S.flowOpen}">
      <span>Goes to <b>${outs.length}</b></span>
      <span>Reached from <b>${ins.length}</b></span>
      <svg class="drchev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>${fd}${tl}
  </div>`;
}

function drSwitch(tab){
  const n=onSelNotes().length, total=S.notes.notes.length;
  const cnt = n?`${n} / ${total}`:`${total}`;
  return `<div class="drswitch"><div class="ex-tabs" role="tablist">
    <button type="button" class="ex-tab" role="tab" data-drtab="review" aria-selected="${tab==="review"}">Write a note</button>
    <button type="button" class="ex-tab" role="tab" data-drtab="activity" aria-selected="${tab==="activity"}">Activity <span class="${BADGE.count}">${cnt}</span></button>
  </div></div>`;
}

function drCompose(){
  const scope = S.sel.size>1 ? `all ${S.sel.size} screens` : escHtml(routeOf([...S.sel][0]));
  const segBtn=(v,label,on)=>`<button type="button" data-v="${v}" class="${on?"on":""}" aria-pressed="${on}">${label}</button>`;
  return `<div class="drcompose">
    <div class="drcseg">
      <div class="seg" role="group" aria-label="Direction" data-drgroup="dir">${segBtn("issue","Issue",S.dir==="issue")}${segBtn("praise","Keep",S.dir==="praise")}</div>
      <div class="seg" role="group" aria-label="Intent" data-drgroup="intent">${segBtn("fix","Fix",S.intent==="fix")}${segBtn("prototype","Prototype",S.intent==="prototype")}</div>
    </div>
    <textarea class="ex-textarea drta" aria-label="Note" placeholder="What's wrong (or right) on ${scope}? For a prototype, describe what to explore."></textarea>
    <div class="drcta">
      <button type="button" class="${BTN.main} drbtn" data-drcopy="1">${S.intent==="prototype"?"Copy prototype brief":"Copy for agent"}</button>
      <button type="button" class="${BTN.mainOutline}" data-drqueue="1">Queue for later</button>
    </div>
    <div class="drhint"><kbd class="ex-kbd">↵</kbd> copy for agent <kbd class="ex-kbd">⌘↵</kbd> queue <kbd class="ex-kbd">⇧↵</kbd> new line</div>
  </div>`;
}

function drActivity(){
  const here=drFilter(onSelNotes()), other=drFilter(elseNotes());
  const total=S.notes.notes.length, open=queueCount();
  let body="";
  if(S.sel.size===0){
    body = other.length? other.slice().reverse().map(drNoteCard).join("") : `<div class="drempty">No notes yet. Select screens and write one.</div>`;
  } else {
    body = `<div class="drscope">On this screen (${here.length})</div>`;
    body += here.length ? here.slice().reverse().map(drNoteCard).join("") : `<div class="drscope soft">No notes here yet.</div>`;
    if(other.length){
      body += S.showElse
        ? `<div class="drdiv">Elsewhere (${other.length})</div>`+other.slice().reverse().map(drNoteCard).join("")
        : `<button type="button" class="${BTN.outline} drelse" data-drelse="1">Show ${other.length} notes on other screens</button>`;
    }
  }
  return `<div class="dract">
    <div class="dralist">${body}</div>
    <div class="drafoot">
      <span class="drct"><b>${open}</b> open · <b>${total}</b> total</span><span class="drsp"></span>
      <div class="drfilter${S.filterOpen?" open":""}">
        <button type="button" class="ex-btn ex-btn--xs ex-btn--outline" data-drfilter="1" aria-expanded="${S.filterOpen}">Show: ${S.actFilter}</button>
        <div class="drfmenu">${["open","approved","all"].map(f=>`<button type="button" data-drsetfilter="${f}" class="${f===S.actFilter?"on":""}">${f}</button>`).join("")}</div>
      </div>
      <button type="button" class="ex-btn ex-btn--xs ex-btn--outline" data-drexport="1">Export</button>
    </div>
    <div class="drsave" id="savehint"></div>
  </div>`;
}

function drNoteCard(n){
  const routes=n.screens.map(routeOf).join("  ·  ");
  const long=(n.body||"").length>150, exp=S.expanded.has(n.id);
  const tags=noteTagsHtml(n);
  const statusEl=`<span class="drstatus"><span class="drdot ${n.status}" aria-hidden="true"></span>${DR_STATUS[n.status]||n.status}</span>`;
  const bodyEl=`<div class="drbody${exp?" exp":""}">${escHtml(n.body)}</div>`+(long?`<button type="button" class="ex-btn ex-btn--link" style="min-height:0;font-size:var(--text-2xs)" data-drmore="${n.id}">${exp?"Show less":"Show more"}</button>`:"");

  if(n.status==="review"){
    const isProto=n.intent==="prototype";
    const first=byId.get(n.screens[0]);
    const live=first&&first.url?S.map.build.devBaseUrl+first.url:null;
    const view=isProto
      ? `<div class="drbdesc">The agent built variations to compare. Review them in the <b>Prototypes</b> view.</div>
         <div class="drbview"><button type="button" class="${BTN.outline}" data-drproto="1">Compare in Prototypes</button></div>`
      : `<div class="drbdesc">The agent changed the live screen. Look at it live, or refresh the shot to see the new version, then approve.</div>
         <div class="drbview">${live?`<a class="${BTN.outline}" href="${escHtml(live)}" target="_blank" rel="noopener">View it live ↗</a>`:""}<button type="button" class="${BTN.ghost}" data-drrefresh="${n.id}">Refresh the shot</button></div>`;
    return `<div class="drncard review" data-drnote="${n.id}">
      <div class="drnhead">${tags}${statusEl}</div>${bodyEl}
      <div class="drnroute">${escHtml(routes)}</div>
      <div class="drreviewblock">
        <div class="drbtitle"><span class="drdot review" aria-hidden="true"></span>Your call: ${isProto?"pick a direction":"approve the change"}</div>
        ${view}
        <div class="drbacts"><button type="button" class="${BTN.solid}" data-drapprove="${n.id}">Approve</button><button type="button" class="${BTN.ghost}" data-drchanges="${n.id}">Request changes</button></div>
      </div></div>`;
  }

  const working = n.status==="sent" ? `<div class="drworking"><span class="drdot sent" aria-hidden="true"></span>The agent is working. The note comes back here for review when it's done.</div>` : "";
  let verb="", menu=[];
  if(n.status==="queued"){ verb=`<button type="button" class="ex-btn ex-btn--xs" data-drcopysend="${n.id}">Copy for agent</button>`; menu=[["Show screens","show"],["Delete","del","danger"]]; }
  else if(n.status==="sent"){ menu=[["Copy again","copy"],["Back to queue","toqueue"],["Refresh screens","refresh"]]; }
  else if(n.status==="approved"){ verb=`<button type="button" class="ex-btn ex-btn--xs ex-btn--outline" data-drreopen="${n.id}">Reopen</button>`; menu=[["Copy for agent","copy"]]; }
  const mopen=S.openMenu===n.id;
  const menuHtml=`<div class="drovf${mopen?" open":""}"><button type="button" class="ex-btn ex-btn--xs ex-btn--ghost" data-drovf="${n.id}" aria-label="More actions" aria-expanded="${mopen}">⋯</button><div class="drmenu">${menu.map(([t,a,c])=>`<button type="button" class="${c||""}" data-dract="${a}" data-drnid="${n.id}">${t}</button>`).join("")}</div></div>`;
  return `<div class="drncard${n.status==="approved"?" approved":""}" data-drnote="${n.id}">
    <div class="drnhead">${tags}${statusEl}</div>${bodyEl}${working}
    <div class="drnfoot"><span class="drnroute">${escHtml(routes)}</span>${verb}${menuHtml}</div>
  </div>`;
}

/* Delegated drawer interactions, bound once on #drawer (they survive innerHTML rebuilds). */
function wireDrawer(){
  const d=document.getElementById("drawer");
  d.addEventListener("input",e=>{ if(e.target.classList.contains("drta")) S.draft=e.target.value; });
  // Enter → copy for agent · ⌘/Ctrl+Enter → queue for later · Shift+Enter → newline.
  d.addEventListener("keydown",async e=>{
    if(!e.target.classList.contains("drta")) return;
    if(e.key!=="Enter"||e.shiftKey||e.isComposing) return;
    e.preventDefault();
    S.draft=e.target.value;
    if(e.metaKey||e.ctrlKey){
      if(addReview({copyIt:false})) toast("Queued. Copy the batch anytime from the Queue button.");
      else toast("Write a note first.");
      return;
    }
    const n=addReview({copyIt:true});
    if(!n){ toast("Write a note first."); return; }
    const ok=await copy(agentBriefFor(n));
    toast(ok?(n.intent==="prototype"?"Prototype brief copied. Moved to With agent.":"Brief copied. Moved to With agent."):"Saved, but the copy failed. Use the note's Copy for agent.");
  });
  d.addEventListener("click",async e=>{
    const t=e.target.closest("[data-drclose],[data-drtab],[data-drflow],[data-drnav],[data-drzoom],[data-drver],[data-drcompare],[data-drdrop],[data-drgroup] button,[data-drcopy],[data-drqueue],[data-drelse],[data-drmore],[data-drproto],[data-drapprove],[data-drchanges],[data-drrefresh],[data-drcopysend],[data-drreopen],[data-drovf],[data-dract],[data-drfilter],[data-drsetfilter],[data-drexport]");
    if(!t){ if(S.openMenu||S.filterOpen){ S.openMenu=null; S.filterOpen=false; renderSel(); } return; }
    const noteById=id=>S.notes.notes.find(n=>n.id===id);
    if(t.dataset.drclose!==undefined){ S.drawerOpen=false; S.selectMode=false; S.sel.clear(); renderSel(); render(); return; }
    if(t.dataset.drtab){ S.drawerTab=t.dataset.drtab; S.openMenu=null; renderSel(); return; }
    if(t.dataset.drflow!==undefined){ S.flowOpen=!S.flowOpen; renderSel(); return; }
    if(t.dataset.drnav){ S.sel=new Set([t.dataset.drnav]); S.flowOpen=false; renderSel(); render(); return; }
    if(t.dataset.drzoom){ openLightbox(t.dataset.drzoom); return; }
    if(t.dataset.drver){ const [vid,vi]=t.dataset.drver.split(":"); openLightbox(vid,{compare:true,before:+vi||1}); return; }
    if(t.dataset.drcompare){ openLightbox(t.dataset.drcompare,{compare:true,before:1}); return; }
    if(t.dataset.drdrop){ S.sel.delete(t.dataset.drdrop); renderSel(); render(); return; }
    if(t.closest("[data-drgroup]")){ const g=t.closest("[data-drgroup]").dataset.drgroup; if(g==="dir")S.dir=t.dataset.v; else S.intent=t.dataset.v; renderSel(); return; }
    if(t.dataset.drcopy!==undefined){ const n=addReview({copyIt:true}); if(!n){ toast("Write a note first."); return; }
      const ok=await copy(agentBriefFor(n)); toast(ok?(n.intent==="prototype"?"Prototype brief copied. Moved to With agent.":"Brief copied. Moved to With agent."):"Saved, but the copy failed. Use the note's Copy for agent."); return; }
    if(t.dataset.drqueue!==undefined){ if(addReview({copyIt:false})) toast("Queued. Keep going, or copy the batch from the Queue menu."); else toast("Write a note first."); return; }
    if(t.dataset.drelse!==undefined){ S.showElse=true; renderSel(); return; }
    if(t.dataset.drmore){ const id=t.dataset.drmore; S.expanded.has(id)?S.expanded.delete(id):S.expanded.add(id); renderSel(); return; }
    if(t.dataset.drproto!==undefined){ S.view="prototypes"; render(); return; }
    if(t.dataset.drapprove){ const n=noteById(t.dataset.drapprove); if(n) setStatus(n,"approved"); return; }
    if(t.dataset.drchanges){ const n=noteById(t.dataset.drchanges); if(n) followUp(n); return; }
    if(t.dataset.drrefresh){ const n=noteById(t.dataset.drrefresh); if(n) recapture(n.screens,n); return; }
    if(t.dataset.drcopysend){ const n=noteById(t.dataset.drcopysend); if(!n)return; const ok=await copy(agentBriefFor(n)); if(n.status==="queued") setStatusSilent(n,"sent"); save(); toast(ok?"Brief copied. Moved to With agent.":"Copy failed."); render(); return; }
    if(t.dataset.drreopen){ const n=noteById(t.dataset.drreopen); if(n) setStatus(n,"queued"); return; }
    if(t.dataset.drovf){ S.openMenu = S.openMenu===t.dataset.drovf?null:t.dataset.drovf; S.filterOpen=false; renderSel(); return; }
    if(t.dataset.dract){ const n=noteById(t.dataset.drnid); if(!n)return; const a=t.dataset.dract; S.openMenu=null;
      if(a==="show"){ S.sel=new Set(n.screens); S.view="board"; render(); }
      else if(a==="del"){ delNote(n); }
      else if(a==="copy"){ const ok=await copy(agentBriefFor(n)); toast(ok?"Brief copied.":"Copy failed."); renderSel(); }
      else if(a==="toqueue"){ setStatus(n,"queued"); }
      else if(a==="refresh"){ recapture(n.screens,n); }
      return; }
    if(t.dataset.drfilter!==undefined){ S.filterOpen=!S.filterOpen; renderSel(); return; }
    if(t.dataset.drsetfilter){ S.actFilter=t.dataset.drsetfilter; S.filterOpen=false; renderSel(); return; }
    if(t.dataset.drexport!==undefined){ exportMd(); return; }
  });
}

function addReview({copyIt}){
  const body=(S.draft||"").trim(); if(!body||!S.sel.size)return null;
  const n={ id:"n_"+Math.random().toString(36).slice(2,9), screens:[...S.sel],
    direction:S.dir, intent:S.intent,
    body, status: copyIt?"sent":"queued", author:"me", createdAt:new Date().toISOString(),
    history:[{status: copyIt?"sent":"queued", note:"created", at:new Date().toISOString()}] };
  S.notes.notes.push(n);
  S.draft="";
  save(); render();
  return n;
}

function wire(){
  document.getElementById("q").addEventListener("input",e=>{ S.q=e.target.value; render(); });
  document.addEventListener("click",()=>{ if(S.open){ S.open=null; renderHeader(); } });
  wireDrawer(); // all in-drawer controls are delegated on #drawer
  // Lightbox controls are delegated on #lb — its inner DOM is rebuilt on every flip.
  const lb=document.getElementById("lb");
  lb.addEventListener("click",e=>{
    if(e.target.id==="lb"){ closeLightbox(); return; }
    const c=e.target.closest("[data-lbact]"); if(!c) return;
    const a=c.dataset.lbact;
    if(a==="close") closeLightbox();
    else if(a==="flip") lbFlip();
    else if(a==="single"){ S.cmp=null; renderLightbox(); }
    else if(a==="cmpon"){ const v=versionsOf(byId.get(S.lbId)); if(v.length>1){ S.cmp={before:1,showB:true}; renderLightbox(); } }
    else if(a==="ver"){ if(S.cmp){ S.cmp.before=Math.max(1,+c.dataset.i||1); S.cmp.showB=true; renderLightbox(); } }
  });
  document.getElementById("nm").addEventListener("click",e=>{ if(e.target.id==="nm") closeNoteModal(); });
  document.addEventListener("keydown",e=>{
    if(nmOpen()){ if(e.key==="Escape") closeNoteModal(); return; }
    if(lbOpen()){
      if(e.key==="Escape"){ closeLightbox(); return; }
      if(S.cmp){
        const v=versionsOf(byId.get(S.lbId));
        if(e.key==="f"||e.key==="F"||e.key===" "){ e.preventDefault(); lbFlip(); return; }
        if(e.key==="ArrowLeft"){  e.preventDefault(); S.cmp.before=Math.min(v.length-1,S.cmp.before+1); S.cmp.showB=true; renderLightbox(); return; }
        if(e.key==="ArrowRight"){ e.preventDefault(); S.cmp.before=Math.max(1,S.cmp.before-1);          S.cmp.showB=true; renderLightbox(); return; }
      }
      return; // swallow other keys while the lightbox owns focus
    }
    if(e.key!=="Escape")return; if(S.open){S.open=null;renderHeader();return;}
    const t=e.target, inField=t&&/^(TEXTAREA|INPUT|SELECT)$/.test(t.tagName);
    // Protect a half-typed note: Escape in a NON-EMPTY field only blurs. An empty
    // field (e.g. the note we just auto-focused) falls through to clear + close,
    // so a single Escape after selecting always dismisses the pop-out.
    if(inField && String(t.value||"").trim()!==""){ t.blur(); return; }
    if(inField && t.blur) t.blur();
    S.drawerOpen=false; S.selectMode=false; S.sel.clear(); renderSel(); render(); });
}

async function save(){
  const sh=()=>document.getElementById("savehint");
  if(S.served){
    try{ const r=await fetch("/notes",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(S.notes)});
      if(r.ok){ if(sh()) sh().textContent="Saved to .screenmap/notes.json"; return; } }
    catch{ /* fall through to the local fallback — a note is never lost */ }
  }
  localStorage.setItem("screenmap-notes",JSON.stringify(S.notes));
  if(sh()) sh().innerHTML='Saved in this browser (the server is unreachable). <a id="dl" href="#">Download notes.json</a> into .screenmap/';
  const dl=document.getElementById("dl"); if(dl) dl.onclick=(e)=>{ e.preventDefault(); const b=new Blob([JSON.stringify(S.notes,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="notes.json"; a.click(); };
}
function exportMd(){
  let md=`# Screen Map: UX review pipeline\n\n_${new Date().toLocaleString()}, ${S.notes.notes.length} notes (${queueCount()} open)_\n\n`;
  for(const st of STAGES){
    const items=S.notes.notes.filter(n=>n.status===st.k);
    if(!items.length) continue;
    md+=`## ${st.label} (${items.length})\n\n`;
    for(const n of items){
      md+=`### ${n.direction==="praise"?"Keep":"Issue"} · ${n.intent}\n`;
      md+=n.body+"\n\n";
      md+="Screens: "+n.screens.map(id=>byId.get(id)?byId.get(id).route:id).join(", ")+"\n\n---\n\n";
    }
  }
  const b=new Blob([md],{type:"text/markdown"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="screenmap-review.md"; a.click();
}
boot();
</script>
