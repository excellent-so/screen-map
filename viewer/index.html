.drchip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 2px 0 8px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-muted); color: var(--color-strong); font-family: var(--font-mono); font-size: var(--text-2xs); }
.drchip button { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 0; border-radius: 3px; background: none; color: var(--color-subtle); cursor: pointer; }
.drchip button:hover { background: var(--color-card); color: var(--color-strong); }

/* Capture versions: the current one in solid ink, older ones as outlines. */
.drtl { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--color-border); }
.drtl .drk { display: flex; align-items: center; gap: 8px; color: var(--color-subtle); font-size: var(--text-2xs); font-weight: 500; }
.drtl .drk .ex-btn { margin-left: auto; }
.drtlrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.drtlv { height: 24px; padding: 0 8px; border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm); background: none; color: var(--color-body); font-size: var(--text-2xs); font-variant-numeric: tabular-nums; cursor: pointer; }
.drtlv:hover { border-color: var(--color-strong); color: var(--color-strong); }
.drtlv.now { border-color: var(--color-primary); background: var(--color-primary); color: var(--color-primary-foreground); font-weight: 500; }

.drswitch { flex: none; padding: 4px 16px 0; }
.drswitch .ex-tabs { padding: 0; }
.drswitch .ex-tab { flex: 1; justify-content: center; }

.drlower { display: flex; flex: 1; flex-direction: column; min-height: 0; }
.drcompose { display: flex; flex: 1; flex-direction: column; min-height: 0; overflow: auto; padding: 12px 16px 16px; }
.drcseg { display: flex; flex-wrap: wrap; gap: 8px; }
.drcompose .drta { flex: 1; min-height: 120px; margin-top: 12px; resize: none; }
.drcta { display: flex; align-items: stretch; gap: 8px; margin-top: 12px; }
.drbtn { flex: 1 1 auto; }
.drhint { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 8px; color: var(--color-subtle); font-size: var(--text-2xs); }

.dract { display: flex; flex: 1; flex-direction: column; min-height: 0; }
.dralist { flex: 1; min-height: 0; overflow: auto; padding: 8px 16px 12px; }
.drscope { margin: 8px 0 2px; color: var(--color-subtle); font-size: var(--text-2xs); font-weight: 500; }
.drscope.soft { font-weight: 400; }
.drdiv { display: flex; align-items: center; gap: 8px; margin: 16px 0 2px; color: var(--color-subtle); font-size: var(--text-2xs); font-weight: 500; }
.drdiv::before, .drdiv::after { content: ""; flex: 1; height: 1px; background: var(--color-border); }
.drelse { width: 100%; margin-top: 12px; }
.drempty { padding: 12px 0; color: var(--color-subtle); font-size: var(--text-meta); }

/* A note in the drawer. */
.drncard { margin-top: 8px; padding: 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-card); }
.drncard.approved { opacity: 0.6; }
.drncard.review { border-color: var(--color-border-strong); }
.drnhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.drstatus { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; color: var(--color-subtle); font-size: var(--text-2xs); }
.drbody { display: -webkit-box; overflow: hidden; margin: 8px 0 4px; color: var(--color-strong); font-size: var(--text-sm); white-space: pre-wrap; -webkit-box-orient: vertical; -webkit-line-clamp: 4; }
.drbody.exp { -webkit-line-clamp: unset; }
.drworking { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: var(--color-body); font-size: var(--text-2xs); }
.drnfoot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.drnroute { flex: 1; overflow: hidden; color: var(--color-subtle); font-family: var(--font-mono); font-size: var(--text-2xs); text-overflow: ellipsis; white-space: nowrap; }
.drovf { position: relative; flex: none; }
.drmenu, .drfmenu { position: absolute; right: 0; bottom: calc(100% + 4px); z-index: 6; display: none; min-width: 168px; }
.drovf.open .drmenu, .drfilter.open .drfmenu { display: block; }
.drmenu button, .drfmenu button {
  display: flex; align-items: center; width: 100%; min-height: var(--control-h-sm); padding: 0 8px; border: 0; border-radius: var(--radius-sm);
  background: none; color: var(--color-body); font-size: var(--text-meta); text-align: left; cursor: pointer;
}
.drmenu button:hover, .drfmenu button:hover { background: var(--color-muted); color: var(--color-strong); }
.drmenu button.danger { color: var(--color-returned-ink); }
.drfmenu button.on { color: var(--color-strong); font-weight: 500; }
.drfmenu button { text-transform: capitalize; }

/* The decision block on a note that's waiting for you. */
.drreviewblock { margin-top: 8px; padding: 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-muted); }
.drbtitle { display: flex; align-items: center; gap: 8px; color: var(--color-strong); font-size: var(--text-meta); font-weight: 600; }
.drbdesc { margin: 6px 0 10px; color: var(--color-body); font-size: var(--text-meta); line-height: 1.25rem; }
.drbdesc b { color: var(--color-strong); font-weight: 600; }
.drbview { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.drbacts { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--color-border-strong); }

.drafoot { display: flex; flex: none; align-items: center; gap: 8px; padding: 6px 16px; border-top: 1px solid var(--color-border); color: var(--color-body); font-size: var(--text-2xs); }
.drct b { color: var(--color-strong); font-weight: 600; font-variant-numeric: tabular-nums; }
.drsp { flex: 1; }
.drfilter { position: relative; }
.drfilter > .ex-btn { text-transform: capitalize; }
.drsave { flex: none; padding: 6px 16px; border-top: 1px solid var(--color-border); color: var(--color-subtle); font-size: var(--text-2xs); }
.drsave:empty { display: none; }

/* --- Overlays: the lightbox, the note view, the toast, the select bar. They float. --------------- */
.lb, .notemodal { position: fixed; inset: 0; display: none; background: rgb(0 0 0 / 0.5); }
.lb { z-index: 50; align-items: center; justify-content: center; padding: 24px; }
.lb.on { display: flex; }
.lb-inner { display: flex; flex-direction: column; gap: 10px; max-width: 94vw; max-height: 92vh; padding: 12px 16px 16px; border-radius: var(--radius-lg); background: var(--color-card); box-shadow: var(--shadow-surface-5); }
.lb-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.lb-bar .rt { color: var(--color-strong); font-family: var(--font-mono); font-size: var(--text-sm); font-weight: 500; }
.lb-bar .lbsp { flex: 1 1 auto; }
.lb-bar .lbcap { color: var(--color-subtle); font-size: var(--text-2xs); }
.lb-bar a { font-size: var(--text-meta); }
.lb-img { min-height: 0; overflow: auto; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-muted); }
.lb-img img { display: block; max-width: 100%; }
.lb-none { padding: 64px 80px; font-size: var(--text-sm); }
.lbcmpbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.lbcmpmeta { color: var(--color-subtle); font-family: var(--font-mono); font-size: var(--text-2xs); }
.lb-img.cmp { position: relative; cursor: pointer; }
.lb-img.cmp img.is-before { outline: 2px dashed var(--color-strong); outline-offset: -2px; }
.lb-img.cmp img.is-after { outline: 2px solid var(--color-strong); outline-offset: -2px; }
.lbtl { display: flex; align-items: center; gap: 6px; padding-top: 2px; }
.lbtl .lbtll { color: var(--color-subtle); font-size: var(--text-2xs); }
.lbtick { width: 16px; height: 16px; padding: 0; border: 1px solid var(--color-border-strong); border-radius: 50%; background: var(--color-card); cursor: pointer; }
.lbtick:hover { border-color: var(--color-strong); }
.lbtick.now { border-color: var(--color-strong); background: var(--color-strong); }
.lbtick.sel { border-color: var(--color-strong); box-shadow: 0 0 0 2px var(--color-card), 0 0 0 4px var(--color-strong); }

.notemodal { z-index: 52; align-items: flex-start; justify-content: center; overflow: auto; padding: 48px 24px; }
.notemodal.on { display: flex; }
.nm-inner { display: flex; flex-direction: column; gap: 12px; width: min(720px, 94vw); padding: 16px; border-radius: var(--radius-lg); background: var(--color-card); box-shadow: var(--shadow-surface-5); }
.nm-bar { display: flex; align-items: center; gap: 12px; }
.nm-title { color: var(--color-strong); font-size: var(--text-base); font-weight: 600; }
.nm-sp, .nm-fsp { flex: 1 1 auto; }
.nm-list { display: flex; flex-direction: column; gap: 12px; }
.nm-card { padding: 16px; border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-background); }
.nm-card.resolved { opacity: 0.7; }
.nm-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
.nm-stat { display: inline-flex; align-items: center; gap: 6px; color: var(--color-body); font-size: var(--text-meta); }
.nm-date { margin-left: auto; color: var(--color-subtle); font-size: var(--text-2xs); }
.nm-routes { margin-bottom: 8px; color: var(--color-subtle); font-family: var(--font-mono); font-size: var(--text-2xs); word-break: break-all; }
.nm-body { margin: 8px 0; color: var(--color-strong); font-size: var(--text-sm); white-space: pre-wrap; }
.nm-hist { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--color-border); }
.nm-hrow { display: flex; align-items: center; gap: 8px; color: var(--color-subtle); font-size: var(--text-2xs); }
.nm-hrow .nm-hst { color: var(--color-body); }
.nm-hrow .nm-hage { margin-left: auto; white-space: nowrap; }
.nm-act { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.nm-foot { position: sticky; bottom: -48px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 0 0; border-top: 1px solid var(--color-border); background: var(--color-card); }

.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 60; max-width: min(70vw, 560px); padding: 10px 16px;
  border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-card); box-shadow: var(--shadow-surface-4);
  color: var(--color-strong); font-size: var(--text-sm); opacity: 0; pointer-events: none;
  transform: translate(-50%, 16px); transition: opacity var(--dur-fast), transform var(--dur-fast) var(--ease-out-expo);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.selectbar {
  position: fixed; left: 50%; bottom: 24px; z-index: 45; display: none; align-items: center; gap: 12px; padding: 8px 8px 8px 16px;
  border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-card); box-shadow: var(--shadow-surface-4);
  transform: translateX(-50%);
}
.selectbar.on { display: flex; }
.selectbar .sb-count { color: var(--color-strong); font-size: var(--text-sm); white-space: nowrap; }
.selectbar .sb-count b { font-weight: 600; font-variant-numeric: tabular-nums; }
.selectbar .sb-hint { color: var(--color-subtle); font-size: var(--text-meta); white-space: nowrap; }

/* Header Queue menu: the notes staged for later, and Copy all. */
.queuepop { min-width: 320px; max-width: min(400px, calc(100vw - 24px)); max-height: 62vh; overflow: auto; }
.queuepop .qph { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 4px 8px 8px; }
.queuepop .qph h4 { margin: 0; }
.queuepop .qpempty { padding: 4px 8px 8px; color: var(--color-subtle); font-size: var(--text-meta); line-height: 1.25rem; }
.queuepop .qptext { flex: 1 1 auto; overflow: hidden; color: var(--color-body); font-size: var(--text-meta); text-overflow: ellipsis; white-space: nowrap; }

/* Thin scrollbars on the strips that scroll sideways. */
.statsbar::-webkit-scrollbar, .stagefilm::-webkit-scrollbar { height: 6px; }
.statsbar::-webkit-scrollbar-thumb, .stagefilm::-webkit-scrollbar-thumb { border-radius: 3px; background: var(--color-border-strong); }

/* Narrower windows: the header menus drop their labels (each keeps its name for a screen reader). */
@media (max-width: 1100px) {
  .menub > .ex-btn .lbl, .menub > .ex-btn svg.chev { display: none; }
  .menub > .ex-btn { padding: 0 10px; }
}

/* --- A phone: the header takes two rows, the drawer takes the screen ------------------------------ */
@media (max-width: 760px) {
  .topnav { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: 8px; }
  .navsec.left { flex: 1 1 calc(100% - 64px); order: 1; }
  .navsec.right { display: contents; }
  .navsec.right > .menub { order: 4; position: static; }
  .navsec.right > .menub:last-child { order: 2; }
  .navsec.center { flex: 1 1 120px; order: 3; justify-content: flex-start; }
  .search { width: 100%; }
  .pop { top: 100%; left: 12px; right: 12px; min-width: 0; max-width: none; }
  .scell { min-width: 96px; padding: 8px 12px; }
  .canvas { padding: 0 12px 12px; }
  .col { flex-basis: 232px; }
  .drawer { width: 100%; }
  .body.popped .canvas { padding-right: 12px; }
  .selstage, .body.selecting .selstage { display: none; }
  .body.selecting .canvas { filter: none; opacity: 1; }
  .lb { padding: 12px; }
  .notemodal { padding: 12px; }
  .rlrow { flex-wrap: wrap; }
  .rlmid { flex-basis: 100%; order: 3; }
}
/* screen-map:end */
</style>
</head>
<body class="ex-page" data-density="compact">
<div class="app">
  <header>
    <div id="bannerwrap"></div>
    <div class="topnav">
      <div class="navsec left"><span class="brand">
        <svg class="ex-mark" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="6" height="5"/><rect x="9" y="10" width="6" height="5"/><path d="M4 6v7h5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        Screen Map</span></div>
      <div class="navsec center">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.2"/><path d="M19.5 19.5 15.7 15.7"/></svg>
          <input type="search" id="q" placeholder="Filter routes" aria-label="Filter routes" />
        </label>
      </div>
      <div class="navsec right" id="navmenus"></div>
    </div>
    <div class="statsbar" id="statsbar"></div>
  </header>
  <div class="body">
    <div class="canvas" id="canvas"></div>
    <div class="selstage" id="selstage"></div>
    <aside class="drawer" id="drawer"><!-- redesigned drawer is rendered by renderSel() --></aside>
  </div>
</div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Screenshot"><div class="lb-inner"></div></div>
<div class="notemodal" id="nm" role="dialog" aria-modal="true" aria-label="Review notes"><div class="nm-inner" id="nminner"></div></div>
<div class="selectbar" id="selectbar"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const STAGES = [
  { k:"queued",   label:"Queued",      hint:"Drafted, not sent yet" },
  { k:"sent",     label:"With agent",  hint:"Brief copied, agent working" },
  { k:"review",   label:"In review",   hint:"Screens refreshed, your call" },
  { k:"approved", label:"Approved",    hint:"Out of the queue" },
];
const STAGE_LABEL = Object.fromEntries(STAGES.map(s => [s.k, s.label]));
// The command a copied instruction uses. The scoped name works whether Screen Map is installed in the
// project, installed globally, or not installed at all.
const CLI = "npx @excellent-so/screen-map";
// Kit classes, named once: buttons and badges.
const BTN = { solid:"ex-btn ex-btn--sm", outline:"ex-btn ex-btn--sm ex-btn--outline", ghost:"ex-btn ex-btn--sm ex-btn--ghost",
  icon:"ex-btn ex-btn--sm ex-btn--ghost ex-btn--icon", main:"ex-btn", mainOutline:"ex-btn ex-btn--outline" };
const BADGE = { new:"ex-badge ex-badge--info", unres:"ex-badge ex-badge--unchecked", orphan:"ex-badge ex-badge--warning",
  dead:"ex-badge ex-badge--warning", dyn:"ex-badge ex-badge--neutral", review:"ex-badge", count:"ex-badge ex-badge--count",
  tag:"ex-badge ex-badge--outline", soft:"ex-badge ex-badge--neutral", done:"ex-badge ex-badge--success", todo:"ex-badge ex-badge--warning" };
// A route group as a label: "orphan-page" reads "Orphan-page".
function groupLabel(g){ g=String(g==null?"":g); return g.charAt(0).toUpperCase()+g.slice(1); }
// The direction (Issue / Keep) and intent (Fix / Prototype) tags a note carries.
function noteTags(n){ return [el("span",{class:BADGE.tag}, n.direction==="praise"?"Keep":"Issue"), el("span",{class:BADGE.soft}, n.intent==="prototype"?"Prototype":"Fix")]; }
function noteTagsHtml(n){ return `<span class="${BADGE.tag}">${n.direction==="praise"?"Keep":"Issue"}</span><span class="${BADGE.soft}">${n.intent==="prototype"?"Prototype":"Fix"}</span>`; }
// A screen's graph signals as badges (New, Unresolved, Orphan, Dead end, Dynamic).
function signalBadges(s){
  const out=[];
  if(s.isNew) out.push([BADGE.new,"New"]);
  if(!s.resolved) out.push([BADGE.unres,"Unresolved"]);
  if(S.orphan.has(s.id)) out.push([BADGE.orphan,"Orphan"]);
  if(S.dead.has(s.id)) out.push([BADGE.dead,"Dead end"]);
  if(s.dynamic) out.push([BADGE.dyn,"Dynamic"]);
  return out;
}
// A capture state as a badge: captured (check), not captured (open square), failed (red, a cross).
function stateBadgeClass(st){ return "st "+(st.ok?"on ex-badge ex-badge--success":st.error?"ex-badge ex-badge--danger":"ex-badge ex-badge--unchecked"); }
const GLYPH_X = '<i class="ex-glyph ex-glyph--cross" aria-hidden="true"></i>';

const S = { map:null, notes:{notes:[],stale:[]}, prototypes:{prototypes:[]}, view:"board", sel:new Set(), q:"", open:null,
  filters:new Set(), groups:new Set(), showDone:false, showNav:false, drawerOpen:false,
  // Select phase: accumulate a group of screens on the board (⇧/⌘-click or the
  // Select toggle) WITHOUT raising the review stage; proceed to review via the bar.
  selectMode:false,
  dir:"issue", intent:"fix", protoSel:{}, protoNote:{}, served:location.protocol.startsWith("http"),
  // redesigned drawer state
  drawerTab:"review", flowOpen:false, showElse:false, actFilter:"open", openMenu:null, filterOpen:false,
  draft:"", expanded:new Set(),
  // review view: kanban board vs flat list, grouped by stage/section/direction/intent
  reviewLayout:"board", reviewGroupBy:"stage",
  // board layout (cards | table), table sort, auto-recapture cadence (minutes; 0=off)
  boardLayout:"cards", tableSort:{k:"route",dir:1}, autoRecap:0,
  // selection-stage state: which selected screen is enlarged (null = gallery)
  focusId:null,
  // lightbox before/after: which screen it's showing + compare state
  // (cmp=null → single image; else {before:<version idx≥1>, showB:<bool>}).
  lbId:null, cmp:null,
  // note detail / group-review modal: the set of note ids it's showing (null = closed).
  nmIds:null,
  // review-stage multi-select (checkboxes) → "Review N together".
  reviewSel:new Set(),
  // auto-refresh: poll /rev, repaint when a recapture lands. rev = last-seen mtimes.
  autoRefresh:true, rev:null, _busy:false };
function escHtml(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
let prevSelSize=0;
const byId = new Map();
const eFrom = new Map(), eTo = new Map();

const el = (t,a={},...kids)=>{ const n=document.createElement(t);
  for(const[k,v]of Object.entries(a)){ if(k==="class")n.className=v; else if(k==="html")n.innerHTML=v; else if(k.startsWith("on"))n.addEventListener(k.slice(2),v); else n.setAttribute(k,v);}
  for(const c of kids.flat()) if(c!=null) n.append(c.nodeType?c:document.createTextNode(c)); return n; };

let toastTimer=null;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("on"),2800); }

// Robust clipboard: navigator.clipboard on secure/localhost, execCommand fallback for file://.
async function copy(text){
  try{ if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } }catch{ /* fall through */ }
  try{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.append(ta);
    ta.select(); const ok=document.execCommand("copy"); ta.remove(); return ok; }catch{ return false; }
}

// Migrate legacy notes to the review-pipeline schema (open→queued, done→approved).
function migrate(n){
  if(n.status==="open"||!n.status) n.status="queued";
  else if(n.status==="done") n.status="approved";
  if(!STAGE_LABEL[n.status]) n.status="queued";
  if(!n.direction) n.direction="issue";
  if(!n.intent) n.intent="fix";
  if(!Array.isArray(n.history)) n.history=[];
  return n;
}

async function boot(){
  S.map = await (await fetch("screenmap.json",{cache:"no-store"})).json();
  try { S.notes = await (await fetch("notes.json",{cache:"no-store"})).json(); } catch { S.notes={notes:[],stale:[]}; }
  try { S.prototypes = await (await fetch("prototypes.json",{cache:"no-store"})).json(); } catch { S.prototypes={prototypes:[]}; }
  if(!S.prototypes||!Array.isArray(S.prototypes.prototypes)) S.prototypes={prototypes:[]};
  if(!S.served){ const ls=localStorage.getItem("screenmap-notes"); if(ls) S.notes=JSON.parse(ls); }
  S.notes.notes = (S.notes.notes||[]).map(migrate);
  for(const s of S.map.screens){ byId.set(s.id,s); eFrom.set(s.id,[]); eTo.set(s.id,[]); }
  for(const e of S.map.edges){ (eFrom.get(e.from)||[]).push(e); (eTo.get(e.to)||[]).push(e); }
  S.orphan=new Set(S.map.orphans); S.dead=new Set(S.map.deadEnds);
  const p=new URLSearchParams(location.search);
  if(["board","flows","review","prototypes"].includes(p.get("view"))) S.view=p.get("view");
  if(p.get("sel")) for(const id of p.get("sel").split(",")) if(byId.has(id)) S.sel.add(id);
  if(["review","activity"].includes(p.get("dtab"))) S.drawerTab=p.get("dtab");
  if(["board","list"].includes(p.get("rlayout"))) S.reviewLayout=p.get("rlayout");
  if(["stage","section","direction","intent"].includes(p.get("rgroup"))) S.reviewGroupBy=p.get("rgroup");
  if(p.get("drawer")==="1") S.drawerOpen=true;
  try{
    const bl=localStorage.getItem("screenmap-board-layout"); if(bl==="table"||bl==="cards") S.boardLayout=bl;
    S.autoRecap=+(localStorage.getItem("screenmap-autorecap")||0)||0;
  }catch{ /* file:// */ }
  if(["cards","table"].includes(p.get("layout"))) S.boardLayout=p.get("layout");
  renderHeader(); wire(); render();
  if(p.get("lb")&&byId.has(p.get("lb"))) openLightbox(p.get("lb"), p.get("cmp")==="1"?{compare:true,before:+(p.get("before")||1)}:{});
  // Auto-refresh: poll /rev; first call sets the baseline, then repaint on change.
  if(S.served){ S.rev=null; pollRev(); setInterval(pollRev,2500); setInterval(checkAutoRecap,60e3); }
}

// Reviews still in flight (not approved) touching this screen.
function activeReviews(id){ return S.notes.notes.filter(n=>n.status!=="approved"&&n.screens.includes(id)); }
function queueCount(){ return S.notes.notes.filter(n=>n.status!=="approved").length; }

/* ── Redesigned header: nav (brand · centered search · View/Groups dropdowns)
   + a filter stats bar (click 1+ cells to narrow the board). ─────────────── */
const NAVICON = {
  board:'<rect x="4" y="4" width="6.5" height="16" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="10" rx="1.4"/>',
  flows:'<circle cx="6" cy="7" r="2.4"/><circle cx="6" cy="17.5" r="2.4"/><circle cx="18" cy="12.2" r="2.4"/><path d="M8.3 8.2 15.6 11.2M8.3 16.4 15.6 13.4"/>',
  review:'<rect x="4" y="4" width="16" height="16" rx="2.4"/><path d="M8.4 12.4l2.4 2.4 4.8-5.2"/>',
  proto:'<path d="M9 3h6M10 3v5.4l-4.7 8.6a2 2 0 0 0 1.8 3h9.8a2 2 0 0 0 1.8-3L14 8.4V3"/><path d="M7.4 15h9.2"/>',
  chev:'<path d="M6 9l6 6 6-6"/>', layers:'<path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  select:'<rect x="4" y="4" width="16" height="16" rx="2.4" stroke-dasharray="3.4 2.4"/><path d="M8.6 12.2l2.3 2.3 4.5-4.8"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  pulse:'<path d="M3 12h4l2.5-6 5 12L17 12h4"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  off:'<path d="M6 6l12 12M18 6 6 18"/>',
  table:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.5h16M4 15h16M10 4v16"/>',
};
/* Monoline icons, 16px, in the current colour. */
function ico(n,cls){ const s=el("span",{html:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NAVICON[n]||""}</svg>`}).firstChild; if(cls) s.classList.add(cls); return s; }
const VIEWS = [{k:"board",label:"Board",icon:"board"},{k:"flows",label:"Flows",icon:"flows"},{k:"review",label:"Review",icon:"review"},{k:"prototypes",label:"Prototypes",icon:"proto"}];

// Banner dismissal is per-build (build.id changes only when a new build runs, and
// a build with nothing new never shows the banner), so a future build's new-screen
// alert reappears even after you dismiss this one.
function buildId(){ return String((S.map&&S.map.build&&S.map.build.id)||""); }
function bannerDismissed(){ try{ return localStorage.getItem("screenmap-banner-dismissed")===buildId(); }catch{ return false; } }
function dismissBanner(){ try{ localStorage.setItem("screenmap-banner-dismissed",buildId()); }catch{} renderHeader(); }
function renderHeader(){
  renderNavMenus(); renderStatsBar();
  const bw=document.getElementById("bannerwrap"); bw.innerHTML="";
  if(S.map.diff.hadPrevious && S.map.diff.added.length && !bannerDismissed()){
    const n=S.map.diff.added.length;
    bw.append(el("div",{class:"bannerbar",role:"status"},
      el("span",{class:BADGE.new},"New"),
      el("span",{class:"btext"},
        `${n} new screen${n>1?"s":""} since the last build. Your notes carried over. `,
        el("button",{class:"ex-btn ex-btn--link",type:"button",onclick:()=>{ S.filters=new Set(["new"]); S.view="board"; render(); }},"Show only the new ones")),
      el("button",{class:BTN.icon,type:"button","aria-label":"Dismiss",title:"Dismiss",onclick:dismissBanner,html:GLYPH_X})));
  }
}
function renderNavMenus(){ const wrap=document.getElementById("navmenus"); wrap.innerHTML=""; wrap.append(selectToggle(), queueMenu(), viewMenu(), routesMenu(), hamburgerMenu()); }
// A header menu button: an outline control, muted while its menu is open or its filter is on.
function menuButton({key,label,icon,count,active,title,chevron=true,onclick}){
  const open=S.open===key;
  const btn=el("button",{type:"button",class:"ex-btn "+(open||active?"ex-btn--muted":"ex-btn--outline"),title:title||label,"aria-label":label,
    onclick:onclick||(e=>{ e.stopPropagation(); S.open=open?null:key; renderHeader(); })}, ico(icon,"lead"), el("span",{class:"lbl"},label));
  if(key) btn.setAttribute("aria-expanded",String(open));
  if(count) btn.append(el("span",{class:"ex-badge"},count));
  if(chevron) btn.append(ico("chev","chev"));
  return btn;
}
// A row in a header menu. `on` marks the current choice with a check.
function menuRow(on,onclick,...kids){
  const row=el("button",{type:"button",class:"mrow"+(on?" on":""),onclick}, ...kids);
  if(on) row.append(el("i",{class:"ex-glyph mcheck","aria-hidden":"true"}));
  return row;
}
// Notes staged with "Queue for later": a running list of not-yet-sent work, with a
// one-click batch copy. (Purely local; nothing is dispatched until you copy.)
function queuedNotes(){ return S.notes.notes.filter(n=>n.status==="queued"); }
function queueMenu(){
  const q=queuedNotes();
  const box=el("div",{class:"menub"});
  box.append(menuButton({key:"queue",label:"Queue",icon:"clock",count:q.length,title:"Queued notes, staged and not sent yet"}));
  const pop=el("div",{class:"pop queuepop"+(S.open==="queue"?" on":""),onclick:e=>e.stopPropagation()});
  const head=el("div",{class:"qph"}, el("h4",{},`Queued (${q.length})`));
  if(q.length) head.append(el("button",{class:BTN.solid,type:"button",onclick:()=>{ copyQueue(); S.open=null; renderHeader(); }},"Copy all"));
  pop.append(head);
  if(!q.length) pop.append(el("div",{class:"qpempty"},"Nothing queued yet. Select screens, write a note, then choose Queue for later (or press ⌘↵)."));
  else for(const n of q.slice().reverse()){
    pop.append(menuRow(false,()=>{ S.open=null; renderHeader(); openNoteModal([n.id]); },
      noteTags(n)[0], el("span",{class:"qptext"}, n.body)));
  }
  box.append(pop); return box;
}
// Routes: pick the route groups the board shows.
function routesMenu(){
  const counts={}; for(const s of S.map.screens) counts[s.group]=(counts[s.group]||0)+1;
  const box=el("div",{class:"menub"});
  box.append(menuButton({key:"routes",label:"Routes",icon:"layers",count:S.groups.size,active:S.groups.size>0,title:"Show some route groups"}));
  const pop=el("div",{class:"pop"+(S.open==="routes"?" on":""),onclick:e=>e.stopPropagation()});
  pop.append(el("h4",{},"Route groups", S.groups.size?el("button",{class:"ex-btn ex-btn--xs ex-btn--ghost",type:"button",onclick:()=>{ S.groups.clear(); render(); }},"Clear"):null));
  for(const g of S.map.groups){ if(!counts[g]) continue;
    const on=S.groups.has(g);
    pop.append(menuRow(on,()=>{ on?S.groups.delete(g):S.groups.add(g); render(); },
      el("span",{},groupLabel(g)), el("span",{class:BADGE.count+" mtail"},counts[g])));
  }
  box.append(pop); return box;
}
// The menu: everything ambient. Layout, appearance, live updates,
// recapture now, and the auto-recapture cadence.
const RECAP_CADENCES = [[0,"Off"],[5,"Every 5 min"],[15,"Every 15 min"],[60,"Every hour"]];
function setTheme(t){
  document.documentElement.classList.toggle("theme-dark",t==="dark");
  try{ localStorage.setItem("ex-theme",t); }catch{}
}
function hamburgerMenu(){
  const box=el("div",{class:"menub"});
  const btn=el("button",{type:"button",class:"ex-btn ex-btn--icon "+(S.open==="menu"?"ex-btn--muted":"ex-btn--outline"),title:"Menu","aria-label":"Menu","aria-expanded":String(S.open==="menu"),
    onclick:e=>{ e.stopPropagation(); S.open=S.open==="menu"?null:"menu"; renderHeader(); }}, ico("menu","lead"));

  const pop=el("div",{class:"pop"+(S.open==="menu"?" on":""),onclick:e=>e.stopPropagation()});
  pop.append(el("h4",{},"Layout"));
  for(const [k,label,icon] of [["cards","Cards","board"],["table","Table","table"]]){
    pop.append(menuRow(S.boardLayout===k,()=>{
      S.boardLayout=k; try{ localStorage.setItem("screenmap-board-layout",k); }catch{}
      S.open=null; S.view="board"; render(); }, ico(icon), label));

  pop.append(el("h4",{},"Appearance"));
  const theme=document.documentElement.classList.contains("theme-dark")?"dark":"light";
  for(const [k,label,icon] of [["light","Light","sun"],["dark","Dark","moon"]]){
    pop.append(menuRow(theme===k,()=>{ setTheme(k); renderHeader(); }, ico(icon), label));
  }
  pop.append(el("h4",{},"Screens"));
  pop.append(menuRow(false,()=>recaptureAll(), ico("refresh"), "Recapture all now",
    el("span",{class:BADGE.count+" mtail"},recapTargets().length)));
  if(S.served) pop.append(menuRow(S.autoRefresh,()=>{ S.autoRefresh=!S.autoRefresh; if(S.autoRefresh) pollRev(); renderHeader(); },
    ico("pulse"), "Live updates"));
  pop.append(el("h4",{},"Auto-recapture"));
  for(const [m,label] of RECAP_CADENCES){
    pop.append(menuRow(S.autoRecap===m,()=>{
      S.autoRecap=m; try{ localStorage.setItem("screenmap-autorecap",String(m)); }catch{}
      renderHeader(); }, ico(m===0?"off":"clock"), label));
  }
  box.append(pop); return box;
}
function recapTargets(){ return S.map.screens.filter(s=>s.url&&(s.states||[]).some(x=>x.ok)); }
// Bulk recapture: the server caps a /recapture call at 24 ids, so chunk.
async function recaptureAll(){
  if(!S.served){ toast(`Recapture needs the served viewer. Run ${CLI} serve.`); return; }
  if(S._busy){ toast("Already refreshing…"); return; }
  const ids=recapTargets().map(s=>s.id);
  if(!ids.length){ toast("Nothing to recapture."); return; }
  S._busy=true; S.open=null; renderHeader();
  toast(`Recapturing ${ids.length} screens with headless Chrome against the live app…`);
  let done=0, ok=0;
  try{
    for(let i=0;i<ids.length;i+=20){
      const chunk=ids.slice(i,i+20);
      const r=await fetch("/recapture",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ids:chunk})});
      const j=await r.json(); if(j&&j.ok) ok+=j.captured||0;
      done+=chunk.length; toast(`Recapturing… ${Math.min(done,ids.length)}/${ids.length}`);
    }
  }catch(e){ toast("Recapture error: "+e.message); }
  S._busy=false;
  try{ S.rev=await (await fetch("/rev",{cache:"no-store"})).json(); }catch{}
  await refetchMap();
  toast(`Recaptured ${ok}/${ids.length} screens.`);
}
// Cadence tick (1/min): when auto-recapture is on and due, run a full pass.
function checkAutoRecap(){
  if(!S.served || !S.autoRecap || S._busy) return;
  let last=0; try{ last=+(localStorage.getItem("screenmap-autorecap-last")||0)||0; }catch{}
  if(Date.now()-last < S.autoRecap*60e3) return;
  try{ localStorage.setItem("screenmap-autorecap-last",String(Date.now())); }catch{}
  recaptureAll();
}

function renderStatsBar(){
  const bar=document.getElementById("statsbar"); bar.innerHTML="";
  const cells=[
    {k:null,label:"All screens",value:S.map.screens.length},
    {k:"new",label:"New",value:S.map.screens.filter(s=>s.isNew).length},

  ];
  for(const c of cells){

    bar.append(el("button",{type:"button",class:"scell"+(on?" on":""),"aria-pressed":String(on),
      title:isAll?"Show all screens":`Show only ${c.label.toLowerCase()} (${c.value})`,
      onclick:()=>{ if(isAll) S.filters.clear(); else S.filters.has(c.k)?S.filters.delete(c.k):S.filters.add(c.k); render(); }},
      el("span",{class:"lab"},c.label), el("span",{class:"num"},c.value.toLocaleString())));

}

function passes(s){
  if(S.groups.size && !S.groups.has(s.group)) return false;
  if(S.q && !(s.title||s.route).toLowerCase().includes(S.q.toLowerCase())) return false;
  for(const f of S.filters){
    if(f==="new" && !s.isNew) return false;
    if(f==="unresolved" && s.resolved) return false;
    if(f==="orphan" && !S.orphan.has(s.id)) return false;
    if(f==="dead" && !S.dead.has(s.id)) return false;
    if(f==="notes" && activeReviews(s.id).length===0) return false;
  }
  return true;
}

function defState(s){ return (s.states||[]).find(x=>x.state===(s._view||"default")&&x.ok) || (s.states||[]).find(x=>x.ok); }
function shotFor(s){ const st=defState(s); return st?st.shot:null; }
// Append capturedAt as a cache-buster so a refreshed screen actually repaints.
function shotSrc(s){ const st=defState(s); if(!st||!st.shot) return null;
  return st.shot + (st.capturedAt?`?t=${encodeURIComponent(st.capturedAt)}`:""); }

// Compact relative age ("just now" / "5m" / "3h" / "2d") for capture timestamps.
function relTime(iso){ if(!iso) return ""; const t=Date.parse(iso); if(isNaN(t)) return "";
  const s=Math.max(0,(Date.now()-t)/1000);
  if(s<45) return "just now"; const m=s/60;
  if(m<60) return Math.max(1,Math.round(m))+"m"; const h=m/60;
  if(h<36) return Math.round(h)+"h"; return Math.round(h/24)+"d"; }
// "just now", or "5m ago".
function ago(iso){ const r=relTime(iso); return !r||r==="just now"?r:r+" ago"; }
// The default state's version stack, newest→oldest: [current ("Now"), ...archived].
// Populated by recapture (build.mjs threads `history[]` onto the state).
function versionsOf(s){ const st=(s&&s.states||[]).find(x=>x.state==="default"&&x.ok)||defState(s);
  if(!st||!st.shot) return [];
  const hist=Array.isArray(st.history)?st.history:[];
  return [{shot:st.shot,capturedAt:st.capturedAt,now:true},...hist]; }
function verSrc(v){ const t=v.capturedAt||v.archivedAt; return v.shot+(t?`?t=${encodeURIComponent(t)}`:""); }
function verAge(v){ return v.now?"now":relTime(v.capturedAt||v.archivedAt); }

function lbOpen(){ return document.getElementById("lb").classList.contains("on"); }
function closeLightbox(){ document.getElementById("lb").classList.remove("on"); }
function lbEmptyMsg(s){ const cold=(s.states||[]).find(x=>x.cold&&x.reason);
  return cold?cold.reason:(s.resolved?`No capture for this screen yet. Run ${CLI} build.`:(s.resolveNote||"An unresolved dynamic route: there's no concrete page to capture.")); }
function wireLbImgError(){ const img=document.querySelector("#lbimg img"); if(!img) return;
  img.addEventListener("error",()=>{ const box=document.getElementById("lbimg"); if(box){ box.classList.remove("cmp"); box.innerHTML=`<div class="lb-none">The screenshot file is missing. Run ${CLI} build again.</div>`; } }); }
function openLightbox(id, opts={}){ const s=byId.get(id); if(!s) return;
  S.lbId=id; const vers=versionsOf(s);
  S.cmp = (opts.compare && vers.length>1)
    ? { before: Math.min(Math.max(1, opts.before||1), vers.length-1), showB:true } : null;
  renderLightbox();
  document.getElementById("lb").classList.add("on");
}
function lbFlip(){ if(S.cmp){ S.cmp.showB=!S.cmp.showB; renderLightbox(); } }
const LB_CLOSE = `<button type="button" class="${BTN.ghost}" data-lbact="close" title="Close (Esc)">Close <kbd class="ex-kbd">Esc</kbd></button>`;
// Full-size viewer. Single image, or a before/after compare (flip button + F/Space/
// arrows + a version scrubber) when the screen has a capture history.
function renderLightbox(){
  const s=byId.get(S.lbId); const inner=document.querySelector("#lb .lb-inner");
  if(!s||!inner) return;
  const vers=versionsOf(s);
  // A refetch may have shrunk history out from under an open compare: clamp or exit.
  if(S.cmp){ if(vers.length<2) S.cmp=null; else S.cmp.before=Math.min(Math.max(1,S.cmp.before|0),vers.length-1); }
  const title=(s.title||s.route)+(s.redirectTo?"  redirects to "+s.redirectTo:"");
  const live=s.url?`<a href="${escHtml(S.map.build.devBaseUrl+s.url)}" target="_blank" rel="noopener">Open live ↗</a>`:"";
  if(!S.cmp){
    const src=shotSrc(s), cap=defState(s)&&defState(s).capturedAt;
    const cmpBtn=vers.length>1?`<button type="button" class="${BTN.outline}" data-lbact="cmpon" title="Compare against a previous capture">Compare (${vers.length})</button>`:"";
    const body=src?`<div class="lb-img" id="lbimg"><img src="${src}" alt="Screenshot of ${escHtml(s.route)}"></div>`
      :`<div class="lb-img"><div class="lb-none">${escHtml(lbEmptyMsg(s))}</div></div>`;
    inner.innerHTML=`<div class="lb-bar"><span class="rt">${escHtml(title)}</span>${live}
      ${cap?`<span class="lbcap">Captured ${ago(cap)}</span>`:""}
      <span class="lbsp"></span>${cmpBtn}${LB_CLOSE}</div>${body}`;
    wireLbImgError(); return;
  }
  const bi=S.cmp.before, before=vers[bi], after=vers[0], showB=S.cmp.showB, cur=showB?before:after;
  const label=showB?`Before, ${verAge(before)} ago`:`After, now`;
  // Scrubber reads left to right, oldest to now, so render the newest-first stack reversed.
  const ticks=vers.map((v,i)=>({v,i})).reverse().map(({v,i})=>`<button type="button" class="lbtick${i===bi?" sel":""}${i===0?" now":""}" data-lbact="ver" data-i="${i}" title="${v.now?"Current (now)":escHtml(v.capturedAt||v.archivedAt||"")}" aria-label="${v.now?"Current capture":"Capture from "+escHtml(verAge(v))+" ago"}"></button>`).join("");
  inner.innerHTML=`<div class="lb-bar"><span class="rt">${escHtml(title)}</span>${live}
      <span class="lbsp"></span>
      <button type="button" class="${BTN.outline}" data-lbact="single" title="Leave the compare">Single view</button>${LB_CLOSE}</div>
    <div class="lbcmpbar">
      <button type="button" class="${BTN.outline}" data-lbact="flip" title="Flip (F, Space, or click the image)">Flip to ${showB?"after":"before"}</button>
      <span class="${BADGE.tag}">${label}</span>
      <span class="lbsp"></span>
      <span class="lbcmpmeta">${verAge(before)} ago to now</span>
    </div>
    <div class="lb-img cmp" id="lbimg" data-lbact="flip" title="Click to flip"><img src="${verSrc(cur)}" alt="${showB?"Before":"After"}" class="${showB?"is-before":"is-after"}"></div>
    <div class="lbtl"><span class="lbtll">Older</span>${ticks}<span class="lbtll">Now</span></div>`;
  wireLbImgError();
  // Preload the other side so the flip is instant.
  try{ new Image().src=verSrc(showB?after:before); }catch{}
}
// Enter or Space on a focused card or row acts like a click.
function keyActivate(node,fn){ node.tabIndex=0; node.addEventListener("keydown",ev=>{ if(ev.target!==node) return; if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); fn(ev); } }); }
function card(s){
  const sel=S.sel.has(s.id);
  const c=el("div",{class:"card"+(sel?" sel":""),"data-id":s.id,role:"button","aria-pressed":String(sel),"aria-label":(s.title||s.route)});
  const thumb=el("div",{class:"thumb"});
  const src=shotSrc(s);
  if(src){ const img=el("img",{src,loading:"lazy",alt:""});
    img.addEventListener("error",()=>{ thumb.innerHTML=""; thumb.append(el("div",{class:"ph"},"Screenshot missing")); });
    thumb.append(img); }
  else { const cold=(s.states||[]).find(x=>x.cold&&x.reason);
    thumb.append(el("div",{class:"ph"}, cold?cold.reason:(s.resolved?"No capture yet":(s.resolveNote||"Unresolved")))); }
  thumb.append(el("button",{type:"button",class:BTN.outline+" ex-btn--icon zoom",title:"View full size","aria-label":"View full size",
    onclick:(ev)=>{ev.stopPropagation();openLightbox(s.id);}},"⤢"));
  // "In review" rides centered on the shot itself, so the badge row stays lean.
  const ar=activeReviews(s.id);
  if(ar.length) thumb.append(el("div",{class:"inrev"},
    el("span",{class:BADGE.review},`${ar.length} in review`)));
  c.append(thumb);
  const body=el("div",{class:"cbody"});
  body.append(el("div",{class:"route"},s.title||s.route));
  const badges=el("div",{class:"badges"});
  for(const [cls,label] of signalBadges(s)) badges.append(el("span",{class:cls},label));
  body.append(badges);
  const states=el("div",{class:"states"});
  for(const st of (s.states||[])){
    const chip=el("span",{class:stateBadgeClass(st),title:st.ok?`Show the ${st.state} capture`:(st.reason||st.error||st.state),
      onclick:(ev)=>{ ev.stopPropagation(); if(st.ok){ s._view=st.state; render(); } }},
      st.state+(st.approx?"~":""));
    states.append(chip);
  }
  if(states.children.length) body.append(states);
  c.append(body);
  c.addEventListener("click",(ev)=>toggleSel(s.id,ev));
  keyActivate(c,(ev)=>toggleSel(s.id,ev));
  return c;
}
function toggleSel(id,ev){
  const additive = ev.shiftKey||ev.metaKey||ev.ctrlKey;
  const was=S.sel.size;
  if(additive || S.selectMode){
    // Group-building: ⇧/⌘-click (or Select mode) toggles this screen in the group
    // and keeps the board up, with no review stage until the user proceeds.
    if(additive) S.selectMode=true;
    S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);
  } else {
    // Plain click = quick single-screen review (opens the stage straight away).
    if(S.sel.size===1&&S.sel.has(id)) S.sel.clear(); else { S.sel.clear(); S.sel.add(id); }
  }
  // A fresh selection lands on Review (compose) so writing a note costs no extra tap.
  if(was===0 && S.sel.size>0) S.drawerTab="review";
  renderSel(); render();
}

function render(){ renderHeader();
  const cv=document.getElementById("canvas");
  cv.innerHTML="";
  if(S.view==="board") cv.append(renderBoard());
  else if(S.view==="review") cv.append(renderReview());
  else if(S.view==="prototypes") cv.append(renderPrototypes());
  else cv.append(renderFlows());
  renderSel();
}
function renderBoard(){ return S.boardLayout==="table" ? renderScreenTable() : renderBoardCards(); }
function renderBoardCards(){
  const cols=el("div",{class:"cols"});
  for(const g of S.map.groups){
    const screens=S.map.screens.filter(s=>s.group===g && passes(s))
      .sort((a,b)=>(((a.flow?a.flow.index:1e9))-((b.flow?b.flow.index:1e9)))||a.route.localeCompare(b.route));
    if(!screens.length) continue;
    const col=el("div",{class:"col"});
    col.append(el("div",{class:"colh"}, el("span",{class:"gname"},groupLabel(g)), el("span",{class:BADGE.count},screens.length)));
    const cards=el("div",{class:"cards"});
    for(const s of screens) cards.append(card(s));
    col.append(cards); cols.append(col);
  }
  if(!cols.children.length) return el("div",{class:"ex-empty",style:"margin-top:16px"},
    el("p",{class:"ex-empty__title"},"No screens match"),
    el("p",{class:"ex-empty__text"},"Clear the search or the filters above to see every screen."));
  return cols;
}
/* The sortable table layout: the board as data. Route, group, graph signals,
   state coverage, reviews, last capture, and capture iterations. */
const TCOLS=[
  { k:"route",      label:"Route",      sort:s=>s.title||s.route },
  { k:"group",      label:"Group",      sort:s=>s.group||"" },
  { k:"signals",    label:"Signals" },
  { k:"states",     label:"States" },
  { k:"reviews",    label:"Reviews",    sort:s=>activeReviews(s.id).length, num:true },
  { k:"captured",   label:"Captured",   sort:s=>Date.parse(capturedWhen(s).at||"")||0, num:true },
  { k:"iterations", label:"Versions",   sort:s=>versionsOf(s).length, num:true },
];
// When a capture was taken. Cached shots carry no per-shot stamp, so the build
// time is the honest upper bound, flagged as such.
function capturedWhen(s){
  const st=defState(s);
  if(!st||!st.shot) return { at:null, approx:false };
  if(st.capturedAt) return { at:st.capturedAt, approx:false };
  return { at:(S.map.build&&S.map.build.generatedAt)||null, approx:true };
}
const EMPTY_CELL = () => el("span",{class:"ex-cell-empty"},"None");
function renderScreenTable(){
  const col=TCOLS.find(c=>c.k===S.tableSort.k);
  const screens=S.map.screens.filter(passes).slice().sort((a,b)=>{
    if(!col||!col.sort) return 0;
    const va=col.sort(a), vb=col.sort(b);
    return (typeof va==="string" ? va.localeCompare(vb) : va-vb)*S.tableSort.dir;
  });
  const wrap=el("div",{class:"ex-table-frame stablewrap"});
  const scroll=el("div",{class:"ex-table-scroll"});
  const table=el("table",{class:"ex-table stable"});
  const hr=el("tr");
  for(const c of TCOLS){
    const th=el("th",{class:c.num?"ex-num":"",scope:"col"}, c.label);
    if(c.sort){
      th.setAttribute("aria-sort", S.tableSort.k===c.k ? (S.tableSort.dir>0?"ascending":"descending") : "none");
      th.tabIndex=0;
      const sortBy=()=>{ if(S.tableSort.k===c.k) S.tableSort.dir*=-1; else S.tableSort={k:c.k,dir:1}; render(); };
      th.addEventListener("click",sortBy);
      th.addEventListener("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); sortBy(); } });
    }
    hr.append(th);
  }
  table.append(el("thead",{},hr));
  const tb=el("tbody");
  for(const s of screens){
    const tr=el("tr",{"aria-selected":String(S.sel.has(s.id))});
    const strut=el("div",{class:"strut"});
    const t=el("div",{class:"tthumb"}); const src=shotSrc(s);
    if(src){ const img=el("img",{src,loading:"lazy",alt:""}); img.addEventListener("error",()=>{ t.innerHTML=""; }); t.append(img); }
    strut.append(t, el("span",{class:"rt"}, s.title||s.route));
    tr.append(el("td",{},strut));
    tr.append(el("td",{}, s.group?groupLabel(s.group):EMPTY_CELL()));
    const sig=el("td");
    for(const [cls,label] of signalBadges(s)) sig.append(el("span",{class:cls},label));
    if(!sig.children.length) sig.append(EMPTY_CELL());
    tr.append(sig);
    const stc=el("td");
    for(const st of (s.states||[])) stc.append(el("span",{class:stateBadgeClass(st),title:st.reason||st.error||st.state},st.state));
    if(!stc.children.length) stc.append(EMPTY_CELL());
    tr.append(stc);
    const ar=activeReviews(s.id).length;
    tr.append(el("td",{class:"ex-num"}, ar?String(ar):EMPTY_CELL()));
    const cap=capturedWhen(s);
    tr.append(el("td",{class:"ex-num",title:cap.approx?"A cached shot: the build time is the upper bound":""},
      cap.at?ago(cap.at)+(cap.approx?" (build)":""):EMPTY_CELL()));
    const iters=versionsOf(s).length;
    tr.append(el("td",{class:"ex-num"}, iters?String(iters):EMPTY_CELL()));
    tr.addEventListener("click",(ev)=>toggleSel(s.id,ev));
    keyActivate(tr,(ev)=>toggleSel(s.id,ev));
    tb.append(tr);
  }
  table.append(tb); scroll.append(table); wrap.append(scroll);
  if(!screens.length) return el("div",{class:"ex-empty",style:"margin-top:16px"},
    el("p",{class:"ex-empty__title"},"No screens match"),
    el("p",{class:"ex-empty__text"},"Clear the search or the filters above to see every screen."));
  return wrap;
}

/* ── Review pipeline ────────────────────────────────────────────────────── */
function miniThumbs(ids){
  const wrap=el("div",{class:"mthumbs"});
  const show=ids.slice(0,3);
  for(const id of show){ const s=byId.get(id); const box=el("div",{class:"mthumb",title:s?(s.title||s.route):id,onclick:()=>openLightbox(id)});
    const src=s?shotSrc(s):null;
    if(src){ const img=el("img",{src,alt:id}); img.addEventListener("error",()=>{box.innerHTML="";box.append(el("div",{class:"mph"},"—"));}); box.append(img); }
    else box.append(el("div",{class:"mph"},"No shot"));
    wrap.append(box); }
  if(ids.length>3) wrap.append(el("div",{class:"mthumb"},el("div",{class:"more"},"+"+(ids.length-3))));
  return wrap;
}
function reviewCard(n){
  const c=el("div",{class:"rcard"+(n.status==="refreshing"?" refreshing":"")+(n.status==="review"&&S.reviewSel.has(n.id)?" selected":"")});
  const top=el("div",{class:"top"});
  if(n.status==="review"){
    const cb=el("input",{type:"checkbox",class:"rchk",title:"Select to review together",
      onclick:e=>{ e.stopPropagation(); S.reviewSel.has(n.id)?S.reviewSel.delete(n.id):S.reviewSel.add(n.id); render(); }});
    cb.checked=S.reviewSel.has(n.id); top.append(cb);
  }
  top.append(...noteTags(n));
  if(n.createdAt) top.append(el("span",{class:"rdate",title:new Date(n.createdAt).toLocaleString()}, ago(n.createdAt)));
  c.append(top);
  c.append(miniThumbs(n.screens));
  c.append(el("div",{class:"rt"}, n.screens.map(id=>{const x=byId.get(id);return x?(x.title||x.route):id;}).join("  ·  ")));
  c.append(el("div",{class:"nbody clamp",title:"Open the note",onclick:()=>openNoteModal([n.id])}, n.body));
  const act=el("div",{class:"ract"});
  const copyBtn=(label)=>el("button",{type:"button",class:BTN.outline,onclick:async()=>{
    const ok=await copy(agentBriefFor(n)); toast(ok?"Brief copied. Paste it to your agent.":"Copy failed."); }},label);
  const refreshBtn=el("button",{type:"button",class:BTN.outline,onclick:()=>recapture(n.screens,n)},"Refresh screens");
  if(n.status==="queued"){
    act.append(el("button",{type:"button",class:BTN.solid,onclick:async()=>{
      const ok=await copy(agentBriefFor(n)); setStatus(n,"sent"); toast(ok?"Copied. Moved to With agent.":"Copy failed."); }},"Copy for agent"));
    act.append(el("button",{type:"button",class:BTN.outline,onclick:()=>{ S.sel=new Set(n.screens); S.view="board"; renderSel(); render(); }},"Show screens"));
    act.append(el("button",{type:"button",class:BTN.ghost,onclick:()=>delNote(n)},"Delete"));
  } else if(n.status==="sent"){
    act.append(refreshBtn);
    act.append(copyBtn("Copy again"));
    act.append(el("button",{type:"button",class:BTN.ghost,onclick:()=>setStatus(n,"queued")},"Back to queue"));
  } else if(n.status==="refreshing"){
    act.append(el("span",{class:"meta"},"Refreshing screens…"));
  } else if(n.status==="review"){
    act.append(el("button",{type:"button",class:BTN.solid,onclick:()=>setStatus(n,"approved")},"Approve"));
    act.append(el("button",{type:"button",class:BTN.outline,onclick:()=>followUp(n)},"Request changes"));
    act.append(refreshBtn);
  } else if(n.status==="approved"){
    act.append(el("button",{type:"button",class:BTN.outline,onclick:()=>setStatus(n,"queued")},"Reopen"));
  }
  c.append(act);
  return c;
}
// The section (screen group) a note belongs to = the group of its first known screen.
function noteSection(n){ for(const id of n.screens){ const s=byId.get(id); if(s) return s.group; } return "—"; }
// A group-by dimension: the ordered keys, how to label/style each, and which key a note lands in.
function reviewGroupDef(){
  switch(S.reviewGroupBy){
    case "section":   return { keys:S.map.groups.slice(), label:groupLabel, hint:()=>"", cls:()=>"sec", keyOf:noteSection };
    case "direction": return { keys:["issue","praise"], label:k=>k==="praise"?"Keep":"Issue", hint:()=>"", cls:k=>k, keyOf:n=>n.direction||"issue" };
    case "intent":    return { keys:["fix","prototype"], label:k=>k==="prototype"?"Prototype":"Fix", hint:()=>"", cls:k=>k, keyOf:n=>n.intent||"fix" };
    default:          return { keys:STAGES.map(s=>s.k), label:k=>STAGE_LABEL[k]||k, hint:k=>(STAGES.find(s=>s.k===k)||{}).hint||"", cls:k=>k, keyOf:n=>n.status };
  }
}
function buildReviewBuckets(){
  const def=reviewGroupDef(), order=def.keys.slice(), bucket={};
  for(const k of order) bucket[k]=[];
  for(const n of S.notes.notes){ const k=def.keyOf(n); if(!bucket[k]){ bucket[k]=[]; order.push(k); } bucket[k].push(n); }
  return { def, order, bucket };
}
function reviewSeg(cur,opts,set){
  const seg=el("div",{class:"seg",role:"group"});
  for(const [k,label] of opts) seg.append(el("button",{type:"button",class:cur===k?"on":"","aria-pressed":String(cur===k),onclick:()=>{ set(k); render(); }},label));
  return seg;
}
function reviewToolbar(){
  const bar=el("div",{class:"rtoolbar"});
  bar.append(reviewSeg(S.reviewLayout,[["board","Board"],["list","List"]],k=>S.reviewLayout=k));
  bar.append(el("div",{class:"rgb"}, el("span",{class:"lbl"},"Group by"),
    reviewSeg(S.reviewGroupBy,[["stage","Stage"],["section","Section"],["direction","Direction"],["intent","Intent"]],k=>S.reviewGroupBy=k)));
  const inflight=queueCount(), total=S.notes.notes.length;
  bar.append(el("span",{class:"rtcount"}, el("b",{},inflight)," in flight · ", el("b",{},total)," total"));
  if(S.reviewSel.size){
    const ids=[...S.reviewSel];
    bar.append(el("span",{class:"rtsel"}, el("b",{},S.reviewSel.size)," selected",
      el("button",{type:"button",class:BTN.solid,onclick:()=>openNoteModal(ids)},"Review together"),
      el("button",{type:"button",class:BTN.ghost,onclick:()=>{ S.reviewSel.clear(); render(); }},"Clear")));
  }
  return bar;
}
function renderReview(){
  const wrap=el("div",{class:"reviewwrap"});
  wrap.append(reviewToolbar());
  const g=buildReviewBuckets();
  wrap.append(S.reviewLayout==="list" ? renderReviewList(g) : renderReviewBoard(g));
  return wrap;
}
function renderReviewBoard({def,order,bucket}){
  const board=el("div",{class:"rboard"});
  const byStage=S.reviewGroupBy==="stage";
  for(const k of order){
    const notes=bucket[k]||[];
    if(!byStage && !notes.length) continue;          // stage always shows its 4 columns; others hide empties
    const col=el("div",{class:"rcol"});
    const h=el("div",{class:"rcolh "+def.cls(k)}, el("span",{class:"dot"}), el("span",{class:"gname"},def.label(k)),
      el("span",{class:BADGE.count},notes.length), def.hint(k)?el("span",{class:"hint"},def.hint(k)):null);
    if(k==="queued"&&notes.length>1)
      h.append(el("button",{type:"button",class:BTN.solid,onclick:copyQueue},"Copy all"));
    if(byStage&&k==="review"&&notes.length){
      const sel=notes.filter(x=>S.reviewSel.has(x.id)), ids=(sel.length?sel:notes).map(x=>x.id);
      h.append(el("button",{type:"button",class:BTN.solid,onclick:()=>openNoteModal(ids)},
        sel.length?`Review ${sel.length}`:`Review all (${notes.length})`));
    }
    col.append(h);
    const cards=el("div",{class:"rcards"});
    if(!notes.length) cards.append(el("div",{class:"rempty"}, k==="queued"?"Select screens on the board, write a note, and choose Queue for later to stage a batch.":"Nothing here."));
    for(const n of notes.slice().reverse()) cards.append(reviewCard(n));
    col.append(cards); board.append(col);
  }
  return board;
}
function renderReviewList({def,order,bucket}){
  const list=el("div",{class:"rlist"});

  let shown=0;
  for(const k of order){
    const notes=bucket[k]||[];
    if(!notes.length) continue;
    shown++;
    const sec=el("div",{class:"rlsec"});
    sec.append(el("div",{class:"rlsech "+def.cls(k)}, el("span",{class:"dot"}), el("span",{class:"gname"},def.label(k)),
      def.hint(k)?el("span",{class:"hint"},def.hint(k)):null, el("span",{class:BADGE.count},notes.length)));
    for(const n of notes.slice().reverse()) sec.append(reviewListRow(n,showStatus));
    list.append(sec);

  if(!shown) list.append(el("div",{class:"rempty"},"No reviews yet. Select screens on the board, write a note, and choose Queue for later to stage one."));

}

/* ── Prototype review ──────────────────────────────────────────────────────
   A Prototype note's brief asks the agent to build a few throwaway variations and
   list them in .screenmap/prototypes.json; this view shows them side by side so you
   can pick one, say why, and copy the decision back. */
function protoSelSet(id){ if(!S.protoSel[id]) S.protoSel[id]=new Set(); return S.protoSel[id]; }
function protoToggle(id,key,e){
  const sel=protoSelSet(id), multi=e.shiftKey||e.metaKey||e.ctrlKey;
  if(multi){ sel.has(key)?sel.delete(key):sel.add(key); }
  else if(sel.size===1&&sel.has(key)) sel.clear();
  else { sel.clear(); sel.add(key); }
  render();
}
function devBase(){ return (S.map&&S.map.build&&S.map.build.devBaseUrl)||"http://localhost:3000"; }
// A variation shows its screenshot when the entry names one (`shot`, a path under
// .screenmap/); otherwise it's a link to open live.
function variationShot(v){
  const box=el("div",{class:"vframe"});
  if(v.shot){ const img=el("img",{src:v.shot+(v.shotAt?`?t=${encodeURIComponent(v.shotAt)}`:""),loading:"lazy",alt:v.label||""});
    img.addEventListener("error",()=>{ box.innerHTML=""; box.append(el("div",{class:"vph"},"Preview missing. Open it live.")); });
    box.append(img); }
  else box.append(el("div",{class:"vph"},"No preview. Open it live."));
  return box;
}
async function savePrototypes(){
  if(S.served){
    try{ const r=await fetch("/prototypes",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(S.prototypes)});
      if(r.ok){ toast("Decision saved to .screenmap/prototypes.json"); return; } }catch{ /* fall through */ }
  }
  localStorage.setItem("screenmap-prototypes",JSON.stringify(S.prototypes)); toast("Saved in this browser (the server is unreachable).");
}
function protoNoteVal(p){ return S.protoNote[p.id]!=null ? S.protoNote[p.id] : (p.decision?p.decision.note:""); }
// The screen ids behind a prototype's source routes, for the recapture command.
function protoSourceIds(p){ return (p.sourceRoutes||[]).map(r=>{ const s=S.map.screens.find(x=>x.route===r||x.url===r); return s?s.id:null; }).filter(Boolean); }
function protoDecisionBrief(p,chosen,note){
  const routes=(p.sourceRoutes||[]).join(", ")||"(not specified)", many=chosen.length>1, ids=protoSourceIds(p);
  let md=`# Prototype decision: ${p.title}\n\n`;
  md += many
    ? `**Picked ${chosen.length} variations (combine them, or use each in its own context; see the note):**\n`+chosen.map(v=>`- ${v.key}, ${v.label}: ${v.technique}  (${v.route})`).join("\n")+"\n"
    : `**Picked:** Variation ${chosen[0].key}, ${chosen[0].label}  (${chosen[0].route})\n**Technique:** ${chosen[0].technique}\n`;
  md += `\n**Target screen(s):** ${routes}\n\n**What I want:**\n${(note||"").trim() || (many?"(combine the selected variations)":"(ship this variation as it is)")}\n\n`;
  md += `**Ship it:** apply ${many?"the selected direction":`variation ${chosen[0].key}`} to the live route(s) above using the app's existing components, and delete the prototype pages. Then `;
  md += ids.length ? `run \`${CLI} recapture --ids=${ids.join(",")}\`` : `recapture the source screens with \`${CLI} recapture --ids=<screen ids>\``;
  md += ` so I can approve the change in Screen Map's Review view.\n`;
  return md;
}
function recordProtoDecision(p,chosen,note){

  p.status="decided"; savePrototypes(); render();

/* ── Flows: every screen as a node in its group's column, links as ink lines ──
   Kinds of link are told apart by their dash, never by colour. */
const FLOW_EDGES = [["link","Link"],["push","router.push"],["redirect","Redirect"],["step","Step (a state or flow in order)"],["navbar","Global nav"]];
function edgeSample(kind){ return `<svg width="28" height="8" aria-hidden="true"><path class="fedge ${kind}" d="M1 4H27"/></svg>`; }
function nodeSample(cls,wall){ return `<svg width="28" height="14" aria-hidden="true"><rect class="fbox ${cls}" x="0.5" y="0.5" width="27" height="13" rx="3"/>${wall?'<rect class="wall" x="24" y="0.5" width="3.5" height="13"/>':""}</svg>`; }
function renderFlows(){
  const wrap=el("div",{class:"flowswrap"});
  const navBtn=el("button",{type:"button",class:"ex-btn ex-btn--sm "+(S.showNav?"ex-btn--muted":"ex-btn--outline"),"aria-pressed":String(S.showNav),
    onclick:()=>{S.showNav=!S.showNav;render();}},"Show global nav links");
  wrap.append(el("div",{class:"flowbar"}, navBtn,
    el("span",{class:"meta"},"Links most screens share (a nav bar) stay hidden until you show them or select a screen. Click a screen to see its links.")));
  wrap.append(el("div",{class:"flegend",html:
    FLOW_EDGES.map(([k,l])=>`<span>${edgeSample(k)}${escHtml(l)}</span>`).join("")+
    `<span>${nodeSample("orphan")}Orphan (nothing links in)</span><span>${nodeSample("",true)}Dead end (no way out)</span><span>${nodeSample("inrev")}In review</span>`}));

  const gs=S.map.groups.filter(g=>S.map.screens.some(s=>s.group===g&&passes(s)));
  const colW=236, rowH=28, padX=8, padY=8, nodeW=196, nodeH=22, maxChars=24;
  const pos=new Map(); const colCount={};
  const ordered=S.map.screens.filter(passes).slice().sort((a,b)=>{
    if(a.group!==b.group) return gs.indexOf(a.group)-gs.indexOf(b.group);
    const ai=a.flow?a.flow.index:null, bi=b.flow?b.flow.index:null;
    if(ai!=null&&bi!=null) return ai-bi;
    if(ai!=null) return -1; if(bi!=null) return 1;
    return a.route.localeCompare(b.route);
  });
  for(const s of ordered){
    const gi=gs.indexOf(s.group); if(gi<0)continue;
    const row=(colCount[s.group]=(colCount[s.group]||0)); colCount[s.group]++;
    pos.set(s.id,{x:padX+gi*colW, y:padY+24+row*rowH, gi});
  }
  const maxRows=Math.max(1,...Object.values(colCount));
  const W=padX*2+gs.length*colW, H=padY+32+maxRows*rowH;
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("height",H);
  svg.setAttribute("width",W); svg.setAttribute("class","flowsvg"); svg.setAttribute("role","img");
  svg.setAttribute("aria-label",`Navigation graph: ${ordered.length} screens in ${gs.length} groups`);
  gs.forEach((g,i)=>{ const t=document.createElementNS(NS,"text");
    t.setAttribute("x",padX+i*colW); t.setAttribute("y",padY+12); t.setAttribute("class","fgroup"); t.textContent=groupLabel(g); svg.append(t); });
  const drawEdge=(e)=>{ const a=pos.get(e.from),b=pos.get(e.to); if(!a||!b)return;
    const x1=a.x+nodeW, y1=a.y+nodeH/2; let d;
    if(a.gi===b.gi){ const bow=x1+28, y2=b.y+nodeH/2; d=`M${x1},${y1} C${bow},${y1} ${bow},${y2} ${b.x+nodeW},${y2}`; }
    else { const x2=b.x, y2=b.y+nodeH/2, mx=(x1+x2)/2; d=`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`; }
    const p=document.createElementNS(NS,"path"); p.setAttribute("d",d);
    const hot=S.sel.has(e.from)||S.sel.has(e.to);
    p.setAttribute("class","fedge "+e.kind+(hot?" hot":"")); svg.append(p); };
  for(const e of S.map.edges){
    if(!pos.has(e.from)||!pos.has(e.to))continue;
    const touch=S.sel.has(e.from)||S.sel.has(e.to);
    const isBar=e.kind==="nav"||e.kind==="navbar";
    if(touch || (isBar ? S.showNav : true)) drawEdge(e);
  }
  for(const s of S.map.screens){ const p=pos.get(s.id); if(!p)continue;
    const name=s.title||s.route;
    const cls=["fnode"]; if(S.sel.has(s.id)) cls.push("sel"); if(S.orphan.has(s.id)) cls.push("orphan"); if(activeReviews(s.id).length) cls.push("inrev");
    const g=document.createElementNS(NS,"g"); g.setAttribute("class",cls.join(" "));
    g.setAttribute("transform",`translate(${p.x},${p.y})`);
    const tip=document.createElementNS(NS,"title"); tip.textContent=name+(S.orphan.has(s.id)?" (orphan)":"")+(S.dead.has(s.id)?" (dead end)":"");
    const r=document.createElementNS(NS,"rect"); r.setAttribute("width",nodeW); r.setAttribute("height",nodeH); r.setAttribute("rx",4);
    g.append(tip,r);
    if(S.dead.has(s.id)){ const w=document.createElementNS(NS,"rect"); w.setAttribute("class","wall"); w.setAttribute("x",nodeW-4); w.setAttribute("width",4); w.setAttribute("height",nodeH); g.append(w); }
    const t=document.createElementNS(NS,"text"); t.setAttribute("x",8); t.setAttribute("y",15);
    t.textContent=(name.length>maxChars?"…"+name.slice(-(maxChars-1)):name);
    g.append(t); g.addEventListener("click",(ev)=>toggleSel(s.id,ev)); svg.append(g);
  }
  wrap.append(el("div",{style:"overflow-x:auto"},svg));
  return wrap;
}

/* ── Agent brief (the "hit a button" payload) ───────────────────────────── */
function liveUrl(s){ return s&&s.url ? S.map.build.devBaseUrl+s.url : null; }
function screenLines(ids){
  return ids.map(id=>{ const s=byId.get(id); const u=liveUrl(s);
    let line=`- ${s?(s.title||s.route):id}${u?"  ("+u+")":""}`;
    if(s&&s.file) line+=`\n  - source: \`${s.file}\` (start here, then trace into the components it renders)`;
    const shots=(s&&s.states||[]).filter(st=>st.ok&&st.shot);
    if(shots.length) line+=`\n  - capture: ${shots.map(st=>"`.screenmap/"+st.shot+"`"+(shots.length>1?" ("+st.state+")":"")).join(", ")} (read this PNG first: it's the exact state this note is about)`;
    return line; }).join("\n");
}
function agentBriefFor(n){
  const ids=n.screens;
  const routes=ids.map(id=>{const x=byId.get(id);return x?(x.title||x.route):id;}).join(", ");
  const dirLine = n.direction==="praise" ? "Keep this, and do more of it" : "Issue to fix";
  let md = (n.intent==="prototype" ? `# Prototype request: ${routes}\n\n` : `# UX review: ${routes}\n\n`);
  md += `**Screen(s):**\n${screenLines(ids)}\n\n`;
  md += `**${dirLine}**\n\n`;
  md += `${n.body}\n\n`;
  if(n.intent==="prototype"){
    const slug = (n.screens[0]||"proto").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
    const sourceRoutes = n.screens.map(id=>byId.get(id)?byId.get(id).route:id);
    const entry = { id:slug, title:"…", sourceRoutes, brief:"One line on what's being fixed", status:"open",
      variations:[{ key:"A", label:"…", technique:"…", route:"/…/a" }, { key:"B", label:"…", technique:"…", route:"/…/b" }] };
    md += `**Build it as a throwaway prototype. Keep to these constraints:**\n`;
    md += `- Build 2 or 3 labelled variations (A, B, C) as pages the dev server at ${S.map.build.devBaseUrl} serves, in one place you can delete in one go and keep out of version control. Leave the live route(s) above as they are.\n`;
    md += `- Use only the components and styles the app already has. Mock the data shown in the capture above, with no database reads and no network calls. If this note is about an empty state, show the design both empty and populated on the same page, stacked and labelled.\n`;
    md += `- Check each variation with a screenshot before you hand it back.\n`;
    md += `- List them for review: add an entry to the \`prototypes\` array in \`.screenmap/prototypes.json\` (create the file if it's missing). Screen Map's Prototypes view reads it:\n`;
    md += "```json\n"+JSON.stringify({ prototypes:[entry] },null,2)+"\n```\n";
    md += `- When you're done, give me each variation's URL so I can open them.\n`;
    md += `\n**Close the loop:** I'll pick a variation in Screen Map's Prototypes view, say why, and copy the decision back to you.\n`;
  } else {
    md += `**When done:** change the live route(s) above, then run\n`;
    md += "```\n"+`${CLI} recapture --ids=${ids.join(",")}`+"\n```\n";
    md += `or choose **Refresh screens** on this note in Screen Map, so the pipeline shows me the new version to approve.\n`;
  }
  return md;
}
function copyQueue(){
  const q=S.notes.notes.filter(n=>n.status==="queued");
  if(!q.length){ toast("Nothing queued."); return; }
  const md=`# UX review batch: ${q.length} item(s)\n_${new Date().toLocaleString()}, from Screen Map_\n\n`+
    q.map(agentBriefFor).join("\n\n---\n\n");
  copy(md).then(ok=>{ if(ok){ for(const n of q) setStatusSilent(n,"sent"); save(); render(); toast(`Copied ${q.length} briefs. Moved to With agent.`);} else toast("Copy failed."); });
}

/* ── Pipeline transitions ──────────────────────────────────────────────── */
function pushHist(n,status,note){ n.history=n.history||[]; n.history.push({status,note:note||null,at:new Date().toISOString()}); }
function setStatusSilent(n,status,note){ n.status=status; pushHist(n,status,note); }
function setStatus(n,status,note){ setStatusSilent(n,status,note); save(); render(); }
function delNote(n){ S.notes.notes=S.notes.notes.filter(x=>x!==n); save(); render(); }
function followUp(n){
  const extra=prompt("What still needs changing? (adds a follow-up note and sends it back to the queue)");
  if(extra==null) return;
  const t=extra.trim(); if(t) n.body += `\n\n↳ follow-up (${new Date().toLocaleDateString()}): ${t}`;
  setStatus(n,"queued","requested changes");
  toast("Back in the queue. Copy it again to send the follow-up.");
}
// Append a dated note onto a review's body without changing its stage.
function appendNote(n,text){ const v=(text||"").trim(); if(!v) return false;
  n.body += `\n\n↳ note (${new Date().toLocaleDateString()}): ${v}`; pushHist(n,n.status,"note added"); return true; }

/* ── Note detail / group-review modal ──────────────────────────────────────
   Click a note anywhere → full text + history + actions; select several
   "In review" notes → resolve / annotate the whole group in one place. */
function nmOpen(){ const m=document.getElementById("nm"); return !!m&&m.classList.contains("on"); }
function closeNoteModal(){ S.nmIds=null; const m=document.getElementById("nm"); if(m) m.classList.remove("on"); }
function nmNotes(){ return (S.nmIds||[]).map(id=>S.notes.notes.find(n=>n.id===id)).filter(Boolean); }
function openNoteModal(ids){

}
function renderNoteModal(){

    foot.append(el("button",{type:"button",class:BTN.outline,onclick:()=>{ const t=prompt(`Add a note to all ${notes.length} reviews:`); if(t==null) return; let k=0; for(const n of notes) k+=appendNote(n,t)?1:0; if(k){ save(); renderNoteModal(); render(); toast(`Note added to ${k} review${k>1?"s":""}.`); } }},"Add a note to all"));
    foot.append(el("span",{class:"nm-fsp"}));
    foot.append(el("button",{type:"button",class:BTN.outline,onclick:()=>{ const md=`# UX review batch: ${notes.length} item(s)\n\n`+notes.map(agentBriefFor).join("\n\n---\n\n"); copy(md).then(ok=>toast(ok?`Copied ${notes.length} briefs.`:"Copy failed.")); }},"Copy all"));

function nmCard(n,group){
  const c=el("div",{class:"nm-card"+(n.status==="approved"?" resolved":"")});
  const head=el("div",{class:"nm-head"},

  c.append(head);

  c.append(miniThumbs(n.screens));
  c.append(el("div",{class:"nm-body"}, n.body));
  if(n.history&&n.history.length>1){
    const tl=el("div",{class:"nm-hist"});
    for(const h of n.history){ const row=el("div",{class:"nm-hrow"}, el("span",{class:"drdot "+h.status}), el("span",{class:"nm-hst"}, STAGE_LABEL[h.status]||h.status));
      if(h.note) row.append(el("span",{}, h.note));
      row.append(el("span",{class:"nm-hage"}, ago(h.at))); tl.append(row); }

  else act.append(el("button",{type:"button",class:BTN.outline,onclick:()=>{ setStatus(n,"queued"); renderNoteModal(); }},"Reopen"));
  act.append(el("button",{type:"button",class:BTN.outline,onclick:()=>{ const t=prompt("Add a note or a follow-up:"); if(t==null) return; if(appendNote(n,t)){ save(); renderNoteModal(); render(); } }},"Add a note"));
  act.append(el("button",{type:"button",class:BTN.outline,onclick:async()=>{ const ok=await copy(agentBriefFor(n)); toast(ok?"Brief copied.":"Copy failed."); }},"Copy for agent"));
  act.append(el("button",{type:"button",class:BTN.ghost,onclick:()=>{ S.sel=new Set(n.screens); S.view="board"; closeNoteModal(); renderSel(); render(); }},"Show screens"));
  c.append(act);
  return c;
}

/* ── Refresh (recapture) ───────────────────────────────────────────────── */
async function recapture(ids, n){
  if(!ids||!ids.length) return;
  if(!S.served){
    const cmd=`${CLI} recapture --ids=${ids.join(",")}`;
    const ok=await copy(cmd);
    toast(ok?"Copied the recapture command. Run it, then reload.":"Run: "+cmd);
    return;
  }
  S._busy=true; // pause auto-refresh so a poll can't race the swap
  if(n){ n.status="refreshing"; render(); }
  toast("Refreshing "+ids.length+" screen(s) with headless Chrome against the live app…");
  try{
    const r=await fetch("/recapture",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ids})});
    const j=await r.json();
    if(j&&j.ok){
      for(const res of j.results){ if(res.ok){ const s=byId.get(res.id);
        if(s){ const others=(s.states||[]).filter(x=>x.state!=="default");
          s.states=[{state:"default",ok:true,shot:"shots/"+res.id+".default.png",capturedAt:res.capturedAt,recaptured:true,history:res.history||[]},...others]; } } }
      if(n){ setStatusSilent(n,"review","screens recaptured"); save(); }
      // Advance the poll cursor to the write we just caused so auto-refresh doesn't
      // redundantly refetch + re-toast for our own recapture.
      try{ S.rev=await (await fetch("/rev",{cache:"no-store"})).json(); }catch{}
      if(lbOpen()&&byId.has(S.lbId)) renderLightbox();
      toast(`Refreshed ${j.captured}/${j.requested} screen(s)${j.captured<j.requested?" (some failed)":""}.`);
    } else { toast("Refresh failed: "+((j&&j.error)||"?")); if(n) n.status="sent"; }
  }catch(e){ toast("Refresh error: "+e.message); if(n) n.status="sent"; }
  S._busy=false;
  render();
}

/* ── Auto-refresh: poll /rev, repaint screens the moment a recapture lands ── */
async function pollRev(){
  if(!S.served || !S.autoRefresh || S._busy) return;
  let j; try{ j=await (await fetch("/rev",{cache:"no-store"})).json(); }catch{ return; }
  if(!j||!j.ok) return;
  if(S.rev===null){ S.rev=j; return; }               // first poll: just set the baseline
  if(j.map && j.map!==S.rev.map){ S.rev.map=j.map; await refetchMap(); }
  if(j.proto && j.proto!==(S.rev.proto||0)){ S.rev.proto=j.proto;
    try{ const p=await (await fetch("prototypes.json",{cache:"no-store"})).json();
      if(p&&Array.isArray(p.prototypes)){ S.prototypes=p; if(S.view==="prototypes") render(); } }catch{} }
  S.rev.notes=j.notes;                                 // notes are viewer-owned; just track
}
// Signature of every screen's live capture — changes iff a shot was (re)captured.
function captureSig(m){ const o={}; for(const s of (m&&m.screens||[])){
  const st=(s.states||[]).find(x=>x.state==="default"&&x.ok); if(st) o[s.id]=(st.capturedAt||"")+"|"+(st.shot||""); } return o; }
async function refetchMap(){
  let m; try{ m=await (await fetch("screenmap.json",{cache:"no-store"})).json(); }catch{ return; }
  if(!m||!Array.isArray(m.screens)) return;
  const before=captureSig(S.map), after=captureSig(m);
  const changed=Object.keys(after).filter(id=>before[id]!==after[id]);
  const cv=document.getElementById("canvas"); const winY=window.scrollY, cvY=cv?cv.scrollTop:0; // keep scroll
  S.map=m;
  byId.clear(); eFrom.clear(); eTo.clear();
  for(const s of S.map.screens){ byId.set(s.id,s); eFrom.set(s.id,[]); eTo.set(s.id,[]); }
  for(const e of S.map.edges){ (eFrom.get(e.from)||[]).push(e); (eTo.get(e.to)||[]).push(e); }
  S.orphan=new Set(S.map.orphans); S.dead=new Set(S.map.deadEnds);
  render(); renderSel();
  if(lbOpen()){ if(byId.has(S.lbId)) renderLightbox(); else closeLightbox(); }
  window.scrollTo(0,winY); const cv2=document.getElementById("canvas"); if(cv2) cv2.scrollTop=cvY;
  if(changed.length) toast(`↻ ${changed.length} screen${changed.length>1?"s":""} updated`);
}

/* ── Redesigned drawer: Inspect header · [Review | Activity] · one job at a time ─
   Fixes: (A) one loud identity, not four equal headers; (B) far fewer controls at
   rest — compose lives only under Review, per-note actions collapse to one verb + ⋯;
   (C) whichever job is active owns the whole lower panel + its own scroll, because
   the other panel is UNMOUNTED. A fresh single selection lands on Review (compose)
   so writing a note stays zero-friction — the tool's hottest path. */
const DR_STATUS = { queued:"Queued", sent:"With agent", review:"Ready for you", approved:"Approved" };
function routeOf(id){ const s=byId.get(id); return s?s.route:id; }
function dedupEdges(arr,dir){ const seen=new Set(),out=[]; for(const e of arr){ const oid=dir==="to"?e.to:e.from; if(seen.has(oid))continue; seen.add(oid); out.push(e); } return out; }
function onSelNotes(){ return S.sel.size ? S.notes.notes.filter(n=>n.screens.some(id=>S.sel.has(id))) : []; }
function elseNotes(){ return S.sel.size ? S.notes.notes.filter(n=>!n.screens.some(id=>S.sel.has(id))) : S.notes.notes.slice(); }
function drFilter(list){ if(S.actFilter==="all") return list; if(S.actFilter==="approved") return list.filter(n=>n.status==="approved"); return list.filter(n=>n.status!=="approved"); }

// The reviews panel is a docked right-side bar on the Review view (always
// open there); elsewhere it pops only for an active selection.
function drawerPinned(){ return S.view==="review" && S.sel.size===0; }
function updateDrawer(){
  // In select mode the board stays up (no stage/drawer) so the user can keep
  // picking; only a real review (selection + NOT select mode) raises the stage.
  const reviewing = S.sel.size>0 && !S.selectMode;
  const popped = reviewing || S.drawerOpen || drawerPinned();
  document.getElementById("drawer").classList.toggle("popped",popped);
  document.querySelector(".body").classList.toggle("popped",popped); // reserve canvas scroll space
  document.querySelector(".body").classList.toggle("selecting",reviewing);
  renderStage();
  renderSelectBar();
  prevSelSize=S.sel.size;
}

// Floating action bar for the select phase: count, then Review, Clear, Cancel.
function renderSelectBar(){
  const bar=document.getElementById("selectbar"); if(!bar) return;
  if(!S.selectMode){ bar.classList.remove("on"); bar.innerHTML=""; return; }
  const n=S.sel.size; bar.innerHTML="";
  bar.append(n
    ? el("span",{class:"sb-count"}, el("b",{},n), ` screen${n>1?"s":""} selected`)
    : el("span",{class:"sb-hint"},"Click screens to build a group, then review them"));
  if(n) bar.append(el("button",{type:"button",class:BTN.ghost,onclick:()=>{ S.sel.clear(); renderSel(); render(); }},"Clear"));
  bar.append(el("button",{type:"button",class:BTN.outline,onclick:()=>{ S.selectMode=false; S.sel.clear(); renderSel(); render(); }},"Cancel"));
  const rev=el("button",{type:"button",class:BTN.solid,onclick:()=>{ S.selectMode=false; if(S.sel.size>0) S.drawerTab="review"; renderSel(); render(); }},
    n?`Review ${n}`:"Review");
  rev.disabled=!n; bar.append(rev);
  bar.classList.add("on");
}

/* ── Selection stage: the selected screens, large, to the LEFT of the drawer.
   The board behind is blurred; click a screen to enlarge it (focus) with its notes. */
function deselect(id){ S.sel.delete(id); if(S.focusId===id) S.focusId=null; render(); }
function stageFrame(s,cls){
  const box=el("div",{class:cls});
